name: Test Windows build

# Builds Windows .msi + .exe and uploads them as GitHub Actions
# artifacts ONLY — never attached to a public Release.
#
# Purpose: produce a binary you can install on a real Windows machine
# to validate it actually works (UI launches, hotkey fires, mDNS finds
# the host, chat round-trips) BEFORE we let it anywhere near end users.
#
# Trigger: manually via the Actions tab, or:
#   gh workflow run test-windows.yml -R Gogo6969/kinai
#
# Download the artifact from:
#   https://github.com/Gogo6969/kinai/actions/workflows/test-windows.yml
#   → click the latest run → scroll to "Artifacts" at the bottom
#   → download "kinai-windows-x86_64"
#
# Artifacts auto-expire after 14 days. They are NOT shown on the public
# Releases page. Only repo collaborators can download them.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile=false

      # No signing yet — first goal is "does it launch at all on Windows".
      # Code-signing for Windows is a separate step (needs a code-signing
      # cert from DigiCert/Sectigo/etc., ~$200/year) and will come later
      # once the binary is proven to work.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Explicit `updater` bundle is REQUIRED on Windows. Without it
          # tauri-bundler only produces the raw .msi + .exe — no
          # .msi.zip + .sig pair next to them, which is what the host's
          # cross-platform auto-update flow serves to Windows clients.
          # (On macOS the `updater` bundle is implicit in `app`; not so
          # on Windows.)
          args: '--target x86_64-pc-windows-msvc --bundles msi,nsis,updater'

      # Tauri-action defaults to creating a draft release when run on a
      # tag. On workflow_dispatch with no tag it skips the release and
      # leaves the bundle under target/. Grab the entire bundle tree as
      # a workflow artifact — that's the simplest way to guarantee we
      # capture both the installers (.msi / .exe) AND the auto-updater
      # sidecars (.msi.zip + .sig / .nsis.zip + .sig).
      #
      # An earlier version of this step listed each filename pattern
      # explicitly across multiple lines. actions/upload-artifact@v4
      # only matched the first two patterns (`*.msi` and `*.exe`) and
      # silently dropped the four `.zip` / `.sig` patterns — uploading
      # 2 of 6 files even though the CI log shows the .zip/.sig were
      # produced on disk. The host's stage_windows_update in
      # scripts/deploy.sh then found no .msi.zip + .sig pair and never
      # advertised `windows-x86_64` in the auto-update manifest,
      # leaving Windows clients stranded on whatever version they
      # installed manually. `**` grabs every file under bundle/, all
      # of which stage_windows_update knows how to filter.
      # Diagnostic: list what tauri-bundler actually left on disk
      # right before upload-artifact scans it. We've seen the CI log
      # claim .msi.zip + .nsis.zip files were produced ("Finished 2
      # updater signatures … .msi.zip") but the artifact only contains
      # the .msi + .exe + .sig pair. Either tauri-action cleans them up
      # between bundle + upload, or the upload glob is excluding them.
      # This step makes the truth visible in the workflow run log.
      # The diagnostic listing in CI run 26126533617 proved this:
      # tauri-bundler on Windows produces .msi + .msi.sig + .exe +
      # .exe.sig — but NOT the .msi.zip / .nsis.zip auto-updater
      # wrappers our host needs to push to Windows clients. The .zip
      # wrapping is normally done by tauri-action AS PART of its
      # release-upload step, and tauri-action skips that step entirely
      # on workflow_dispatch (no release context).
      #
      # The Tauri 2 updater plugin for Windows expects:
      #   <name>.msi.zip       — ZIP containing the .msi
      #   <name>.msi.zip.sig   — minisign signature of the .msi.zip
      # Same shape for .nsis.zip + .nsis.zip.sig wrapping the .exe.
      #
      # IMPORTANT: do NOT use PowerShell's `Compress-Archive` here.
      # It produces ZIPs with NTFS-timestamp extra fields and a
      # version-needed-to-extract of 4.5+, which Tauri's Rust `zip`
      # crate rejects at unpack time with "Unsupported Zip archive"
      # — every Windows v0.2.35 client trying to auto-update from
      # v0.2.34 hit exactly that error. Switching to 7-Zip (which
      # is preinstalled on the windows-latest GitHub runner image
      # at C:\Program Files\7-Zip\7z.exe) produces a conservative,
      # spec-clean ZIP that the updater accepts.
      #
      # `-tzip -mx9` = ZIP container, max DEFLATE compression. The
      # archive contains a single file at root: the .msi (or .exe).
      # No extra fields, no ZIP64 unless the file genuinely exceeds
      # 4 GB (our installers are ~12 MB, so this never trips).
      #
      # After zipping we run `pnpm tauri signer sign` to produce
      # the .sig with the same updater key baked into every install
      # via tauri.conf.json's `pubkey`.
      - name: Build updater zip + signature (.msi.zip / .nsis.zip)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) {
            Write-Host "::error::7-Zip not found at $sevenZip"
            exit 1
          }

          $msi = Get-ChildItem -Path target\x86_64-pc-windows-msvc\release\bundle\msi\ -Filter *.msi | Select-Object -First 1
          if ($msi) {
            $zipPath = "$($msi.FullName).zip"
            Write-Host "Wrapping $($msi.FullName) → $zipPath (via 7-Zip)"
            # Push to the .msi's directory so the archive entry is just
            # the basename — no leading path component the updater would
            # have to strip.
            Push-Location $msi.DirectoryName
            & $sevenZip a -tzip -mx9 $zipPath $msi.Name
            Pop-Location
            Write-Host "Signing $zipPath"
            pnpm tauri signer sign --private-key="$env:TAURI_SIGNING_PRIVATE_KEY" --password="$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$zipPath"
          } else {
            Write-Host "::warning::No .msi found to wrap"
          }

          $exe = Get-ChildItem -Path target\x86_64-pc-windows-msvc\release\bundle\nsis\ -Filter *.exe | Select-Object -First 1
          if ($exe) {
            $zipPath = "$($exe.DirectoryName)\$([System.IO.Path]::GetFileNameWithoutExtension($exe.Name)).nsis.zip"
            Write-Host "Wrapping $($exe.FullName) → $zipPath (via 7-Zip)"
            Push-Location $exe.DirectoryName
            & $sevenZip a -tzip -mx9 $zipPath $exe.Name
            Pop-Location
            Write-Host "Signing $zipPath"
            pnpm tauri signer sign --private-key="$env:TAURI_SIGNING_PRIVATE_KEY" --password="$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$zipPath"
          } else {
            Write-Host "::warning::No .exe found to wrap"
          }

      - name: List bundle contents pre-upload
        shell: pwsh
        run: |
          Write-Host "=== msi/ ==="
          Get-ChildItem -Force -Recurse target\x86_64-pc-windows-msvc\release\bundle\msi\ | Format-Table FullName, Length
          Write-Host "=== nsis/ ==="
          Get-ChildItem -Force -Recurse target\x86_64-pc-windows-msvc\release\bundle\nsis\ | Format-Table FullName, Length

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kinai-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/bundle/**
          retention-days: 14
          if-no-files-found: error
          # Tauri's updater bundles (.msi.zip / .nsis.zip) are
          # generated AFTER the main .msi/.exe and AFTER the .sig files
          # — including hidden files protects us from any one ending up
          # with a hidden attribute we didn't expect.
          include-hidden-files: true

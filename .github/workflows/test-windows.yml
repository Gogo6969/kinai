name: Test Windows build

# Builds Windows .msi + .exe and uploads them as GitHub Actions
# artifacts ONLY — never attached to a public Release.
#
# Purpose: produce a binary you can install on a real Windows machine
# to validate it actually works (UI launches, hotkey fires, mDNS finds
# the host, chat round-trips) BEFORE we let it anywhere near end users.
#
# Trigger: manually via the Actions tab, or:
#   gh workflow run test-windows.yml -R Gogo6969/kinai
#
# Download the artifact from:
#   https://github.com/Gogo6969/kinai/actions/workflows/test-windows.yml
#   → click the latest run → scroll to "Artifacts" at the bottom
#   → download "kinai-windows-x86_64"
#
# Artifacts auto-expire after 14 days. They are NOT shown on the public
# Releases page. Only repo collaborators can download them.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile=false

      # No signing yet — first goal is "does it launch at all on Windows".
      # Code-signing for Windows is a separate step (needs a code-signing
      # cert from DigiCert/Sectigo/etc., ~$200/year) and will come later
      # once the binary is proven to work.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Explicit `updater` bundle is REQUIRED on Windows. Without it
          # tauri-bundler only produces the raw .msi + .exe — no
          # .msi.zip + .sig pair next to them, which is what the host's
          # cross-platform auto-update flow serves to Windows clients.
          # (On macOS the `updater` bundle is implicit in `app`; not so
          # on Windows.)
          args: '--target x86_64-pc-windows-msvc --bundles msi,nsis,updater'

      # Tauri-action defaults to creating a draft release when run on a
      # tag. On workflow_dispatch with no tag it skips the release and
      # leaves the bundle under target/. Grab the entire bundle tree as
      # a workflow artifact — that's the simplest way to guarantee we
      # capture both the installers (.msi / .exe) AND the auto-updater
      # sidecars (.msi.zip + .sig / .nsis.zip + .sig).
      #
      # An earlier version of this step listed each filename pattern
      # explicitly across multiple lines. actions/upload-artifact@v4
      # only matched the first two patterns (`*.msi` and `*.exe`) and
      # silently dropped the four `.zip` / `.sig` patterns — uploading
      # 2 of 6 files even though the CI log shows the .zip/.sig were
      # produced on disk. The host's stage_windows_update in
      # scripts/deploy.sh then found no .msi.zip + .sig pair and never
      # advertised `windows-x86_64` in the auto-update manifest,
      # leaving Windows clients stranded on whatever version they
      # installed manually. `**` grabs every file under bundle/, all
      # of which stage_windows_update knows how to filter.
      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kinai-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/bundle/**
          retention-days: 14
          if-no-files-found: error

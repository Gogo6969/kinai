name: Release

# Triggers a multi-platform build whenever a `vX.Y.Z` tag is pushed.
# Also available manually via the Actions tab for one-off test builds.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY            — contents of ~/.kinai/keys/updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   — empty string if the key has no password
#
# Without those secrets the build still succeeds, but the produced
# bundles won't carry an updater signature — clients running on the
# host-distributed updater path won't accept them, and they'll fall back
# to GitHub-direct download.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# An accidental double-push of the same tag shouldn't fork-bomb the CI.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: '--target aarch64-apple-darwin'
          - os: macos-latest
            args: '--target x86_64-apple-darwin'
          - os: ubuntu-22.04
            args: ''
          - os: windows-latest
            args: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            build-essential

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile=false

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'KinAI ${{ github.ref_name }}'
          releaseBody: |
            ## KinAI ${{ github.ref_name }}

            All KinAI binaries are open-source and run 100% locally.

            **Connected to a family host?** Your KinAI will pick this update
            up automatically from the host within ~4 hours, no need to
            download from here. If the host is offline you can install
            directly:

            - **macOS Apple Silicon**: `KinAI_*_aarch64.dmg`
            - **macOS Intel**: `KinAI_*_x64.dmg`
            - **Linux**: `KinAI_*_amd64.deb` / `KinAI_*_amd64.AppImage`
            - **Windows**: `KinAI_*_x64-setup.exe` (NSIS) or `KinAI_*_x64.msi`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

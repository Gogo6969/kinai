name: Release

# Triggers a multi-platform build whenever a `vX.Y.Z` tag is pushed.
# Also available manually via the Actions tab for one-off test builds.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#
#   Updater signing (host-distributed update flow):
#     TAURI_SIGNING_PRIVATE_KEY            — contents of ~/.kinai/keys/updater.key
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD   — empty string if the key has no password
#
#   Apple Developer ID code signing + notarization (macOS Gatekeeper):
#     APPLE_CERTIFICATE                    — base64 of developer-id.p12
#     APPLE_CERTIFICATE_PASSWORD           — password used when exporting the .p12
#     APPLE_SIGNING_IDENTITY               — "Developer ID Application: Wolfgang Gabler (L5VWNX44MY)"
#     APPLE_API_ISSUER                     — App Store Connect API issuer UUID
#     APPLE_API_KEY                        — App Store Connect API key ID (e.g. 8PN9W26H97)
#     APPLE_API_KEY_BASE64                 — base64 of AuthKey_<key>.p8 (we materialize to disk in the job)
#
# Without the updater secret the build still succeeds, but the produced
# bundles won't carry an updater signature. Without the Apple secrets
# the macOS DMGs ship unsigned (Gatekeeper warning); Linux + Windows
# builds are unaffected.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# An accidental double-push of the same tag shouldn't fork-bomb the CI.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: '--target aarch64-apple-darwin'
          - os: macos-latest
            args: '--target x86_64-apple-darwin'
          - os: ubuntu-22.04
            args: ''
          - os: windows-latest
            args: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            build-essential

      # No explicit version here — package.json's `packageManager` field
      # ("pnpm@9.15.0") is the single source of truth. Listing it twice
      # makes pnpm/action-setup error out with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile=false

      # Materialize the App Store Connect .p8 to disk; notarytool needs
      # a file path (not contents). Only on macOS runners; the file is
      # ephemeral (lives only for this job's runtime).
      - name: Materialize Apple API key
        if: matrix.os == 'macos-latest' && env.APPLE_API_KEY_BASE64 != ''
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_BASE64" | base64 -d > ~/private_keys/AuthKey.p8
          chmod 600 ~/private_keys/AuthKey.p8
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing + notarization. tauri-action imports the .p12
          # into a temp keychain, codesigns with hardened runtime, and
          # submits to notary via API key. No-op on Linux/Windows.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'KinAI ${{ github.ref_name }}'
          releaseBody: |
            ## KinAI ${{ github.ref_name }}

            All KinAI binaries are open-source and run 100% locally.

            **Connected to a family host?** Your KinAI will pick this update
            up automatically from the host within ~4 hours, no need to
            download from here. If the host is offline you can install
            directly:

            - **macOS Apple Silicon**: `KinAI_*_aarch64.dmg`
            - **macOS Intel**: `KinAI_*_x64.dmg`
            - **Linux**: `KinAI_*_amd64.deb` / `KinAI_*_amd64.AppImage`
            - **Windows**: `KinAI_*_x64-setup.exe` (NSIS) or `KinAI_*_x64.msi`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

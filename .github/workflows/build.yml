name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # macOS-only. A "CI green on Linux/Windows" badge would imply those
  # builds are usable; they aren't until someone validates the bundles
  # on a real machine. Better to skip the runners than to lie.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # No version pin here — package.json's `packageManager` field
       # ("pnpm@9.15.0") is the single source of truth. Listing both
      # versions makes pnpm/action-setup error out on conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build frontend
        run: pnpm frontend:build

      - name: Cargo build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Cargo test
        run: cargo test --target ${{ matrix.target }} --no-fail-fast

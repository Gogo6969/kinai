# Throwaway debugging harness for the v0.2.81 Windows loader crash
# (cargo test binary dies with STATUS_ENTRYPOINT_NOT_FOUND 0xc0000139).
#
# Runs ONLY on manual dispatch, builds nothing release-shaped, uses NO
# rust cache (cold by construction), and A/Bs the runner image. Delete
# once the root cause is fixed.
name: windows-test
on: workflow_dispatch

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Image A/B answered (both fail). Now ref A/B: v0.2.80's windows
        # job was green at 22:16; if its code fails COLD today, the
        # environment moved underneath us. If only v0.2.81 fails, the
        # 3-commit diff is to blame and gets bisected.
        ref: [v0.2.80, v0.2.81]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile=false
      - name: Build frontend (tauri::generate_context! needs frontendDist)
        run: pnpm --filter kinai-frontend build
      - name: Run cargo test (cold, no rust-cache)
        run: cargo test --lib --quiet
      # If the test binary dies at load again, dump its import table so
      # we can finally see WHICH DLL/symbol the loader can't resolve.
      - name: Dump test binary imports on failure
        if: failure()
        shell: pwsh
        run: |
          $exe = Get-ChildItem target\debug\deps\kinai-*.exe | Select-Object -First 1
          Write-Host "=== dumpbin /imports $($exe.FullName) ==="
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          & $dumpbin.FullName /imports $exe.FullName

# Throwaway harness, v4: verify the comctl32-v6 test-manifest fix on a
# cold windows-latest runner. Delete once release CI is green again.
name: windows-test
on: workflow_dispatch

jobs:
  verify-fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter kinai-frontend build
      - name: Run cargo test (cold)
        run: cargo test --lib --quiet

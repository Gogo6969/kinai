a vision-friendly longest edge before base64-encoding. 1568 px is the size A"}, {"path": "frontend/src/lib/markdown.ts", "kind": "lib", "lines": 149, "doc": "Custom image renderer: enforce a safe URL allow-list and a max-height box. Without this a model can drop a `![…](javascript:…)` or a 50 MP image into chat and either pop XSS or blow up the layout. We accept `https://`, `http://` (LAN-only resources from the host), and `data:` for inline previews / vision uploads — and that's it."}, {"path": "frontend/src/lib/modelName.ts", "kind": "lib", "lines": 23, "doc": "The model id, the way a human should read it. llama-server registers whatever `-m` it was launched with unless an alias was set — so a slot's id can be `/home/olares/models/Qwen3.6-35B-A3B-heretic-MTP-Q4_K_M.gguf`, a filesystem path from another machine, and that string was rendering verbatim in the Settings model dropdown and the composer's picker. Mirror of the Rust rules in slash.rs `display_mo"}, {"path": "frontend/src/lib/platform.ts", "kind": "lib", "lines": 78, "doc": "Which desktop OS this window is running on. KinAI ships one Svelte frontend to three very different machines, and for a long time the copy assumed all of them were Macs: a Windows user following a \"No hosts found\" hint was told to open System Settings → Privacy & Security, a pane that does not exist on their computer, and the microphone errors named macOS panes and offered buttons that were only r"}, {"path": "frontend/src/lib/stores/app.svelte.ts", "kind": "lib", "lines": 1040, "doc": "This machine can synthesize speech (macOS). Mac CLIENTS speak locally with their own voices; hosts are always Macs today."}, {"path": "frontend/src/lib/voice.ts", "kind": "lib", "lines": 68, "doc": "SpeechRecognition isn't part of the standard DOM lib yet — TS doesn't ship the type. Browsers expose it on `window.SpeechRecognition` or the WebKit- prefixed `window.webkitSpeechRecognition`. macOS WKWebView supports the API on macOS 13+ (Sonoma) but routes recognition through Apple's on-device speech model — audio doesn't leave the machine."}, {"path": "frontend/src/routes/+layout.svelte", "kind": "route", "lines": 170, "doc": "DEV-only: installs an in-memory Tauri IPC mock when running in a plain browser (no-op inside the real app; eliminated from production builds)."}, {"path": "frontend/src/routes/+layout.ts", "kind": "route", "lines": 4, "doc": ""}, {"path": "frontend/src/routes/+page.svelte", "kind": "route", "lines": 82, "doc": "First run → the setup wizard owns onboarding (splash + guided steps). The two-card chooser below stays only as a fallback for the edge case \"setup finished/skipped but mode still unconfigured\" (e.g. a config hand-edited back to unconfigured after the wizard)."}, {"path": "frontend/src/routes/about/+page.svelte", "kind": "route", "lines": 57, "doc": ""}, {"path": "frontend/src/routes/client/+page.svelte", "kind": "route", "lines": 282, "doc": "Why \"no hosts found\", per platform. Discovery is mDNS (`_kinai._tcp.local.`, UDP 5353) with the host itself on TCP 4847 — so the honest answer is \"same network, and let KinAI through the firewall\", which is a different sentence on each OS. This screen used to show the macOS one to everybody, which is how a Windows user ended up being told to open System Settings → Privacy & Security, a pane Window"}, {"path": "frontend/src/routes/host/+page.svelte", "kind": "route", "lines": 1266, "doc": "Secondary \"deep\" slot — same shape, but starts disabled + empty so hosts who only want one model keep their existing single-slot behaviour. The configure step now exposes BOTH slots so the user can pick a fast + deep backend in one screen."}, {"path": "frontend/src/routes/host/family/+page.svelte", "kind": "route", "lines": 66, "doc": ""}, {"path": "frontend/src/routes/host/invite/+page.svelte", "kind": "route", "lines": 199, "doc": "TTL options. `0` is the \"never expires\" sentinel — the backend encodes it as a ~100-year JWT so any check in the host's validate_token still passes for the realistic lifetime of the recipient device. Render-time we detect the far-future date and show \"Never\" in the invite-list summary."}, {"path": "frontend/src/routes/host/reports/+page.svelte", "kind": "route", "lines": 147, "doc": ""}, {"path": "frontend/src/routes/overlay/+page.svelte", "kind": "route", "lines": 6, "doc": ""}, {"path": "frontend/src/routes/settings/+page.svelte", "kind": "route", "lines": 2269, "doc": "Fast model — the existing single slot. Reachable as `/fast` once the deep slot is also configured; the default routing target for plain (non-slash) messages."}, {"path": "frontend/src/routes/settings/memory/+page.svelte", "kind": "route", "lines": 362, "doc": "Inline-edit state. Only one row editable at a time."}, {"path": "frontend/src/routes/setup/+page.svelte", "kind": "route", "lines": 1135, "doc": "First-run host setup wizard — the implementation of the approved step-by-step mockup. Design contract: * Splash first; once setup completes (or is skipped) the `setup_completed` config flag guarantees neither splash nor wizard ever appears again (root +page.svelte gates on it). * EVERY step except the role fork and Finish is skippable; each step spells out the consequence of skipping and where to "}], "tests": [{"file": "tests/balanced_tools_live.rs", "doc": "Live diagnosis: run KinAI's REAL pipeline (system prompt + tools + tool runtime) against the balanced slot to see whether tools fire. #[ignore] — needs the live Laguna server + real config.", "tests": [{"name": "balanced_turn_uses_tools", "ignored": true}, {"name": "followup_balanced", "ignored": true}, {"name": "followup_deep", "ignored": true}, {"name": "dead_fast_slot_fails_over_to_balanced", "ignored": true}, {"name": "factcheck_pipeline_against_live_server", "ignored": true}, {"name": "factcheck_against_configured_online_slot", "ignored": true}, {"name": "unknown_fact_balanced", "ignored": true}, {"name": "unknown_fact_fast", "ignored": true}, {"name": "unknown_fact_deep", "ignored": true}]}, {"file": "tests/context_budget.rs", "doc": "Regression test for the generation-budget collapse that made the deep (reasoning) model go silent.", "tests": [{"name": "build_context_reserves_generation_headroom", "ignored": false}]}, {"file": "tests/deep_model_live.rs", "doc": "Live integration test for the deep-model streaming path.", "tests": [{"name": "deep_model_streams_reasoning_and_answer", "ignored": true}, {"name": "deep_model_pipeline_with_tools_returns_answer", "ignored": true}, {"name": "deep_model_starves_at_small_budget_succeeds_at_adequate", "ignored": true}]}, {"file": "tests/discovery_live.rs", "doc": "Live LAN discovery probe — runs KinAI's REAL `scan_local_network()` against whatever network the test machine is on and prints what it finds. This is the legitimate discovery mechanism (the same code the \"Scan network\" button drives),…", "tests": [{"name": "scan_local_network_prints_backends", "ignored": true}]}, {"file": "tests/dump_prompt.rs", "doc": "Dumps the REAL shipped system prompt so prompt-behaviour probes test the actual wording instead of a paraphrase. #[ignore] — a tool, not a test.", "tests": [{"name": "dump_system_prompt", "ignored": true}]}, {"file": "tests/factcheck_live.rs", "doc": "The fact-check button, through KinAI's own code path.", "tests": [{"name": "the_failing_fact_check_now_produces_a_verdict", "ignored": true}, {"name": "fact_check_is_repeatable", "ignored": true}]}, {"file": "tests/forced_search_live.rs", "doc": "The latch, and the fix for it, measured through the REAL pipeline.", "tests": [{"name": "a_poisoned_conversation_still_searches", "ignored": true}, {"name": "a_timeless_question_is_left_alone", "ignored": true}]}, {"file": "tests/routing.rs", "doc": "Tests for slash routing — specifically the bare `/fast` / `/deep` mode switch that must NOT run an empty LLM turn.", "tests": [{"name": "bare_deep_is_a_switch_not_an_empty_turn", "ignored": false}, {"name": "deep_with_prompt_is_not_a_bare_switch", "ignored": false}, {"name": "switch_confirmation_names_the_model", "ignored": false}, {"name": "thread_delete_is_peer_scoped", "ignored": false}]}, {"file": "tests/search_discipline_live.rs", "doc": "Does the model actually SEARCH when asked for a link?", "tests": [{"name": "asking_for_a_link_triggers_a_real_search", "ignored": true}]}, {"file": "tests/search_failure_live.rs", "doc": "What the user sees when a web lookup FAILS.", "tests": [{"name": "a_failed_lookup_is_reported_honestly", "ignored": true}]}, {"file": "tests/searxng_live.rs", "doc": "SearXNG through KinAI's real dispatcher.", "tests": [{"name": "searxng_returns_usable_grounding", "ignored": true}, {"name": "a_wrong_url_fails_loudly_rather_than_silently", "ignored": true}, {"name": "the_settings_test_button_reports_accurately", "ignored": true}]}, {"file": "tests/thread_ops_live.rs", "doc": "End-to-end proof for the client→host thread operations (0.2.86).", "tests": [{"name": "client_thread_delete_reaches_the_host", "ignored": true}]}], "surfaces": {"db_tables": ["invites", "memory_notes", "messages", "peers", "reports", "telegram_active_thread", "telegram_links", "telegram_pending_pairs", "threads", "user_facts"], "protocol_envelope": ["Hello", "Welcome", "RequestTelegramPair", "TelegramPair", "RequestTelegramStatus", "TelegramStatus", "RequestTelegramUnpair", "TelegramUnpairDone", "SendMessage", "StopGeneration", "Token", "Reasoning", "Tool", "Message", "AssistantDone", "ListThreads", "Threads", "LoadThread", "ThreadMessages", "Ping", "Pong", "Error", "PromptDebug", "DeleteThread", "RenameThread", "ThreadOpAck", "ReportAnswer", "ReportAck", "FactCheckRequest", "FactCheckResult", "RequestSlotHealth", "SlotHealth", "ListUserFacts", "SaveUserFact", "DeleteUserFact", "ClearUserFacts", "UserFacts"], "tools": ["calculator", "datetime", "image_search", "remember", "web_search", "x_search"], "slots": ["fast", "balanced", "deep", "online"], "config_structs": ["AppConfig", "ClientSettings", "ComfyConfig", "HostSettings", "LlmSettings", "OverlaySettings", "PinnedHost", "StartupSettings", "SttConfig", "TelegramConfig", "ToolSettings", "TtsConfig", "VisionEndpoint", "VisionSettings"], "tauri_commands": ["check_updates", "clear_user_facts", "connect_client", "consume_invite", "create_thread", "delete_report", "delete_reviewed_reports", "delete_thread", "delete_user_fact", "detect_backends", "disconnect_and_forget", "disconnect_client", "download_stt_model", "download_url_to_path", "edit_and_resend", "fact_check_message", "generate_invite", "get_changelog_payload", "get_config", "install_update", "is_speaking", "kinai_version", "list_invites", "list_local_models", "list_peers", "list_reports", "list_threads", "list_tools", "list_tts_voices", "list_user_facts", "load_thread", "local_ip", "mark_changelog_seen", "mark_setup_completed", "open_logs_dir", "open_report_count", "preview_tts_voice", "query_model_caps", "reconnect_client", "redeem_invite_code", "regenerate_message", "rename_thread", "report_answer", "request_telegram_pair", "rescan_kinai_hosts", "revoke_invite", "revoke_peer", "runtime_stats", "save_user_fact", "scan_local_network", "search_messages", "send_message", "set_comfy_config", "set_llm_balanced_settings", "set_llm_deep_settings", "set_llm_factcheck_settings", "set_llm_online_settings", "set_llm_settings", "set_mode", "set_overlay_settings", "set_report_reviewed", "set_startup_settings", "set_stt_config", "set_telegram_token", "set_theme", "set_tts_config", "set_vision_settings", "slot_health", "speak_text", "start_host", "stop_generation", "stop_host", "stop_speaking", "stt_status", "telegram_link_status", "test_comfy_endpoint", "test_llm_connection", "test_llm_endpoint", "test_searxng", "test_telegram_token", "test_tool", "test_vision_endpoint", "toggle_overlay", "tts_supported", "unpair_telegram", "write_prompt_snapshot"]}, "history": [{"version": "0.2.100", "date": "2026-08-13", "sections": {"Fixed": [{"title": "The fast model stopped answering after a new model was installed.", "detail": "Some models are stricter than others about the order KinAI sends its instructions in, and a newly installed one rejected every message with a \"System message must be at the beginning\" error — so the fast model replied with nothing but an error box. KinAI now always puts its standing instructions first, whatever model you point it at."}, {"title": "Telegram now lists every command KinAI actually has.", "detail": "The Online model was missing from the command menu on your phone: typing `/online` worked, but Telegram never offered it. The menu is now built from the models you have configured, so it also stops offering image commands when no image server is set up, and stops offering model switches when there is only one model to choose from."}]}}, {"version": "0.2.99", "date": "2026-08-12", "sections": {"Fixed": [{"title": "\"Look it up for today\" now works on the Online model.", "detail": "Asking the online model anything that needs fresh information — today's numbers, this week's news — came back as a raw error instead of an answer. KinAI was insisting the model use its web search, in a way DeepSeek's thinking mode refuses outright. It now asks rather than insists, and the model searches anyway, so the answer arrives as it should. Only the Online slot was affected; the models running at home were fine."}]}}, {"version": "0.2.98", "date": "2026-08-12", "sections": {"Changed": [{"title": "Questions about now or later always search the web.", "detail": "Until now a question had to show two independent signals (a live topic plus a time word, say) before KinAI forced a search — \"best flights this week to Belize\" had only one, so whether it searched was up to the model's mood. New rule: a present- or future-anchored phrase (today, tonight, tomorrow, this week, this weekend, latest, currently, …, in English and German) — or any year at or after the current one (\"world cup 2026\", \"Olympics 2028\") — forces the search by itself. Greetings, quizzes, and creative requests (\"write a poem about today\") stay exempt, and past years stay historical. Travel words (flight, airfare, hotel, airline) now also count as live topics."}, {"title": "Fixed along the way: \"what's today's date?\" could trigger a web search because the apostrophe split \"today's\" into words", "detail": ""}], "Added": [{"title": "KinAI now tells you when your VPN is the reason it can't connect.", "detail": "A family member turned on a VPN and KinAI simply went dark — \"Connection timed out\" and nothing else, while every other device in the house was fine. Most VPNs block your local network by default, so the app could no longer reach the family's own host. When a connection to a home address fails, KinAI now checks whether a VPN is involved and says so, with the setting to change — by name for Mullvad, Proton VPN, NordVPN and Tailscale, and in general terms for anything else."}], "Fixed": [{"title": "Model names are shown as names, not file paths.", "detail": "A model served by llama.cpp could appear as `/home/olares/models/Qwen3.6-35B-A3B-heretic-MTP-Q4_K_M.gguf` — a filesystem path from another machine — in the model picker, the slash-command menu, the Settings dropdowns and the reported-answers list. All of them now show the plain name."}]}}, {"version": "0.2.96", "date": "2026-08-11", "sections": {"Added": [{"title": "An Online model slot.", "detail": "Settings → Models gains a fourth card: a hosted, OpenAI-compatible model (DeepSeek, OpenAI, Groq, …) reachable as `/online` in chat and from the model picker. It appears nowhere until you configure it — and it is never used automatically. Your local models cover for each other when one goes down; the online one is only ever reached when someone picks it, because what you send there leaves your home network."}], "Fixed": [{"title": "Windows and Linux no longer get Mac instructions.", "detail": "The \"No KinAI hosts found\" screen used to tell every platform to open macOS's System Settings. Each platform now gets the advice that actually applies to it: Local Network permission on a Mac, the firewall and the Private-network setting on Windows, the firewall on Linux. The same treatment for the microphone errors, keyboard-shortcut symbols, \"this Mac\" wording, and the tray/menu-bar naming throughout the app."}, {"title": "The app icon lost its white corners.", "detail": "The rounded-corner icon had been exported onto a white square — most visible in the Windows taskbar, but the Mac Dock and Linux launcher icons had it too. All icons are regenerated from the original artwork with proper transparency."}, {"title": "\"Scan again\" no longer breaks the search it restarts.", "detail": "Pressing it on the join screen silently stopped host discovery for the rest of the session — the opposite of what the button promises. Found while chasing the Windows report above."}, {"title": "A fresh install starts with setup, not release notes.", "detail": "First launch used to open the \"what's new\" window on top of the setup wizard, describing changes to a version the new user had never run. Release notes now only appear after an actual update."}, {"title": "The macOS network-permission prompt explains itself.", "detail": "When macOS asks about local-network access, the dialog now says what KinAI uses it for (finding your family's host — nothing leaves your home)."}]}}, {"version": "0.2.95", "date": "2026-08-08", "sections": {"Fixed": [{"title": "Fact check often came back with \"the checker model returned an empty report\".", "detail": "The checker is given a budget for its reply, and on a model that thinks before answering — DeepSeek's, among others — that budget covers the thinking too. It was set too low, so the model regularly used the whole allowance working the answer out and had nothing left to write the verdict with. Measured on the reply that failed: 3 of 4 checks produced nothing. The budget is now four times larger, and a check that still runs out quietly tries once more. Same reply, after the fix: 6 of 6 produced a verdict."}, {"title": "When a fact check does fail, it now says what went wrong.", "detail": "\"Try again\" was the same message whether the model ran out of room mid- thought or the API key was wrong — only one of those is worth retrying."}, {"title": "The host setup screen left a timer running every time you opened it.", "detail": "The clock behind \"last scanned 5 minutes ago\" was never stopped when you left the screen, so a fresh one started on each visit and they all kept ticking. Harmless on a quick visit, wasteful over a long session."}], "Added": [{"title": "Fact checks are recorded in the host log (model, prompt and evidence size, how long it took, whether a verdict came back", "detail": ""}]}}, {"version": "0.2.94", "date": "2026-07-30", "sections": {"Added": [{"title": "Choose SearXNG in Settings.", "detail": "0.2.93 added the engine but no way to select it. Settings → Tools now lists it alongside DuckDuckGo and Exa, with a field for your instance's address and a **Test** button that says what is actually wrong — a missing `http://`, nothing listening, or the JSON format not enabled (SearXNG ships with it off, which would otherwise show up as searches that quietly return nothing). On success it shows the first result and which engines answered."}, {"title": "A switch for the Exa fallback.", "detail": "While Exa is selected you can now turn \"use SearXNG if Exa runs out of credit\" on or off. Settings also states plainly that KinAI does not install SearXNG — it is a service you run yourself, and nothing there is required."}], "Fixed": [{"title": "Switching models no longer prints a file path.", "detail": "`/fast` replied \"Switched to the fast model (`/home/olares/models/Qwen3.6-35B-A3B-MTP- UD-Q4_K_S.gguf`)\" because that is the name its server reports. The message now shows just the model name, the way the footer under each answer already did."}]}}, {"version": "0.2.93", "date": "2026-07-30", "sections": {"Added": [{"title": "Pick the model from a menu.", "detail": "The `fast:` / `balanced:` / `deep:` label on the message box now opens a picker showing what each one is for and which model serves it, with a tick on the one in use. A slot your host can't reach is marked \"Offline — auto-switches\". Typing `/fast`, `/balanced` or `/deep` still works exactly as before."}, {"title": "SearXNG as a search engine.", "detail": "If you run your own SearXNG, KinAI can use it: no API key, no cost, and — unlike the other options — your family's questions never leave your own hardware. Set the address in Settings → Tools. Your instance needs its JSON format enabled; if it isn't, KinAI now says so instead of quietly returning nothing."}, {"title": "Search keeps working when Exa runs out of credit.", "detail": "When the paid search is unavailable — credits used up, key rejected — KinAI falls back to your SearXNG rather than failing the question, and says which engine answered so you know to top up. Brief outages still retry on Exa itself."}]}}, {"version": "0.2.92", "date": "2026-07-30", "sections": {"Fixed": [{"title": "A question needing many searches could fail outright.", "detail": "Every search result is added to what the model has to read, and nothing limited how much piled up. One research question ran thirteen searches, and the request grew past what the model could accept — so the whole answer was lost at the last step, after all thirteen searches had been paid for. Results are now trimmed to fit, and clearly marked as shortened so the model tells you when it is working from a fragment rather than presenting a partial answer as complete."}, {"title": "KinAI showed \"thinking\" in conversations that weren't thinking.", "detail": "Asking something in one conversation displayed the same live indicator in every other one. It now appears only where the question was asked."}, {"title": "A search tool that is out of credit no longer apologises four times.", "detail": "When a lookup fails for a reason that cannot change — billing, a wrong API key, missing configuration — KinAI stops calling it for the rest of that turn and says once what is unavailable, instead of retrying the same error each round."}]}}, {"version": "0.2.91", "date": "2026-07-30", "sections": {"Added": [{"title": "The message box now tells you which model will answer.", "detail": "It reads `fast:`, `balanced:` or `deep:` at the head of the input, so the model in force is visible *before* you type — not only in the footer of an answer that has already arrived. Typing `/deep …` switches the label immediately, so it always shows what pressing Enter will actually do. It turns amber when your host reports that slot as unreachable, because KinAI will quietly answer with a different model in that case."}], "Changed": [{"title": "The message box centres its text vertically. With a single line of input the caret used to sit against the bottom edge w", "detail": ""}]}}, {"version": "0.2.90", "date": "2026-07-29", "sections": {"Fixed": [{"title": "\"I don't have real-time data\" — asked for the Bitcoin price, the balanced model refused, and refused every time after that.", "detail": "It was not forgetting it had a search tool. Measured against the live model with an identical prompt: 8/8 searches with a clean conversation, 8/8 after a good answer, and **0/8 once a single refusal sat in the history**. The model copies its own previous turn, so one bad answer latches the whole thread — which is exactly why telling it to search fixed things for the rest of that session and why the next session started badly again. KinAI now takes the decision away from the model: for a question that plainly needs live data, the request goes out with web search as the only available tool and the call *required*. On the exact conversation that scored 0/8, it now searches 12/12. Questions that don't need the web are untouched — a definitional question forced 0 searches in 6 runs."}, {"title": "A search that failed silently dropped its warning.", "detail": "The 0.2.89 banner (\"every web lookup for this answer failed\") only appeared when the model exhausted its tool rounds. If it wrote an answer normally after the lookups failed — the common case — the warning was skipped and the answer looked grounded. Found by a new test, not in the field."}, {"title": "Pressing Stop no longer blames your model server.", "detail": "Stopping a reply before any text appeared reported \"the model returned an empty response … may be offline\". It now says it was stopped."}, {"title": "Date and time questions stay local.", "detail": "\"What time is it?\" is answered from the clock KinAI already puts in every prompt instead of going to the web."}], "Added": [{"title": "Web searches are logged with the tool, query, duration and result size, so a misbehaving lookup can be diagnosed from th", "detail": ""}]}}, {"version": "0.2.89", "date": "2026-07-27", "sections": {"Fixed": [{"title": "A failed web search could come back as \"I can't browse the web\".", "detail": "When a lookup failed, the model was told only that the tool \"failed\" — and models rationalise that as a limitation of themselves. One field report answered a hardware question with \"I can't provide a direct link, as my knowledge doesn't include live web browsing\", which is false: the search tool exists, works, and had just failed once. The tool-failure payload now states explicitly that web access works and that claiming otherwise is wrong. Independently of what the model says, an answer whose every lookup failed now carries a banner saying so — the model can no longer quietly pass its own memory off as a fresh result."}, {"title": "Transient search failures now retry once.", "detail": "Measured Exa latency for KinAI's request ranges from 0.1s to ~7s against a 15s ceiling, so a slow moment cost the entire turn. Timeouts, dropped connections, 5xx and 429 get one more attempt; wrong-API-key and bad-request errors do not (they fail identically, and retrying only delays telling you)."}, {"title": "The model answered \"give me a link\" without searching.", "detail": "Asked for a source, it would lift a URL from an earlier reply in the same thread and present it as the official page — turning that reply's hedge (\"typically 2.5GbE or 1GbE\") into a stated fact, and sometimes landing on the wrong number outright. Measured on the old prompt: only 8 of 15 such turns ran a search, 4 cited a page they never opened, and one reported the wrong Ethernet speed. The tool-discipline rules now say that an earlier reply is not a source and that only pages a search actually returned may be cited: 14 of 15, then 10 of 10 through the live pipeline, with the fake citations and the wrong number gone. Guarded by `tests/search_discipline_live.rs`."}, {"title": "A \"thinking\" model no longer gets blamed on your server.", "detail": "The deep slot's reasoning model regularly ends a round having written only to its hidden reasoning channel. KinAI returned that empty result as \"the model server may still be loading… or may be offline\" — about a server that was healthy and had just streamed hundreds of characters of thought. That case is now named for what it is."}], "Added": [{"title": "Tool calls are logged.", "detail": "Every call records the tool, its arguments, duration and result size; failures log at WARN with the underlying error. Until now a failed search left no trace anywhere, so the only surviving account of it was the model's own invented explanation — which is precisely how the bug above went unexplained."}]}}, {"version": "0.2.88", "date": "2026-07-25", "sections": {"Fixed": [{"title": "Answers could silently render with text crossed out and numbers missing.", "detail": "A lone `~` means \"approximately\" to every model — \"~540 minutes\", \"~29.7 AU\" — but Markdown also reads it as a strikethrough delimiter, so two of them in one paragraph struck out everything in between *and swallowed the tildes*. A fact-check verdict quoting `\"~540 minutes (9 hours)\"` was displayed as a crossed-out `540 minutes (9 hours)`, which no longer matched the answer being checked and read like the checker had invented the claim. A single `~` is now always literal text; deliberate `~~strikethrough~~` still works, and `~/paths` in code spans were never affected. Applies everywhere KinAI renders text: chat, streaming, fact-check panels, and the changelog window."}], "Changed": [{"title": "Fact-check verdicts now say where the problem is.", "detail": "The verdict line must name which part of an answer is wrong — the table, the notes below it, the summary — and each bullet must quote the claim verbatim instead of paraphrasing it. Previously a verdict could flag a figure that only appeared in a footnote while the reader was scanning the table, with no way to tell the two apart."}]}}, {"version": "0.2.87", "date": "2026-07-25", "sections": {"Fixed": [{"title": "Windows and Linux devices could briefly not update at all.", "detail": "For the 30–60 minutes between a new version being installed on the host and its Windows/Linux bundles being staged, the host offered those devices a version it had no download for — and because the updater resolves the download before comparing versions, their update check failed outright instead of falling back. They could not even install a version that was ready for them. The host now answers each platform with the newest version staged *for that platform*, so a device is never offered something it can't install. Macs are unaffected and keep updating immediately."}]}}, {"version": "0.2.86", "date": "2026-07-24", "sections": {"Fixed": [{"title": "Deleted conversations stay deleted on family devices.", "detail": "Deleting (or renaming) a conversation on a joined device only changed that device's own copy — the host still had the original and sent it back on the next launch, so everything reappeared. Those actions now go to the host, which owns the conversation, and the device says so plainly if the change couldn't be saved instead of hiding it and forgetting. The host's own conversations were never affected. Requires host and device on 0.2.86+."}]}}, {"version": "0.2.85", "date": "2026-07-24", "sections": {"Added": [{"title": "Report a bad answer.", "detail": "Every reply now has a small **report** button. When an answer doesn't make sense, one tap tells the host — who gets a new **Reported answers** entry in the sidebar (with a badge for the ones still needing a look) showing the question, the answer, and which model produced it, plus Reviewed / Reopen / Delete. Your privacy is unchanged: a report shares **only that one question and answer** — the rest of your conversation stays invisible to the host, and the button says so before you tap it."}], "Changed": [{"title": "The buttons under a reply (speak, copy, fact check, regenerate, report) now sit on their own line under the message deta", "detail": ""}]}}, {"version": "0.2.84", "date": "2026-07-23", "sections": {"Fixed": [{"title": "No more \"would you like me to search?\"", "detail": "When asked about a person, place, or fact a model doesn't recognize, it now searches immediately instead of asking permission (or worse, inventing an answer). Verified live on all three model slots with the exact question that exposed it (\"Who was Adam Riese?\") — every slot now searches and answers correctly with sources."}]}}, {"version": "0.2.83", "date": "2026-07-23", "sections": {"Fixed": [{"title": "Fact check now works with every OpenAI-compatible provider.", "detail": "The checker no longer relies on the provider's function-calling dialect (DeepSeek V4 answered in its own tool markup, which surfaced as raw `DSML` fragments in the panel). KinAI now runs the verification web searches itself and hands the checker the evidence to judge — more robust, faster, and cheaper. Settings example updated to the current `deepseek-v4-flash` model name."}]}}, {"version": "0.2.82", "date": "2026-07-23", "sections": {"Added": [{"title": "Fact check any answer with one click.", "detail": "A new button in the reply toolbar (next to speak/copy) sends the answer to an independent ONLINE model — configured under Settings → Models → \"Fact-check model\" with any OpenAI-compatible API (DeepSeek, OpenAI, Groq, …). The checker verifies claims with fresh web searches and returns a verdict card (✅ / ⚠️ / ❌ with corrections and sources) right under the message. The card is never saved and never enters the chat context. The button only appears once API credentials are set, works on the host and on family devices, is rate-limited per person, and the checker is never used for normal chat."}], "Fixed": [{"title": "Security hardening:", "detail": "all rendered markdown is now sanitized (DOMPurify) before display — web content quoted by any model can no longer inject HTML into KinAI windows."}, {"title": "Windows release CI died at test startup (comctl32 v6 manifest issue introduced by 0.2.81's new tests) — fixed; this also", "detail": ""}]}}, {"version": "0.2.81", "date": "2026-07-22", "sections": {"Added": [{"title": "No more silent dead models.", "detail": "When a model's server is unreachable (offline, still loading, or not answering), your message no longer disappears into nothing: - The turn **automatically switches to another available model** and the reply starts with a clear notice — \"⚠️ The fast model isn't responding (server unreachable) — answering with balanced (Laguna-XS-2.1) instead.\" Works identically in the app, on family devices, and in Telegram. Your `/fast`-style choice is kept — the conversation returns to your model as soon as it's back. - If **no** model answers, you get one honest, actionable error instead of silence. - The slash menu marks a configured-but-offline model (\"offline right now, auto-switches\") on both host and family devices. - Switching to an offline model with `/fast` etc. warns you immediately instead of letting the next message fail."}, {"title": "Failed turns now show an inline error bubble", "detail": "in the chat (host and family devices) instead of a 5-second toast that was easy to miss — no more \"the AI just ignored me\" moments."}]}}, {"version": "0.2.80", "date": "2026-07-22", "sections": {"Fixed": [{"title": "Family members now see the model switches.", "detail": "The chat's slash menu builds its `/fast` / `/balanced` / `/deep` entries from the local model settings — which are empty on family (client) installs, so the switches never appeared there even though typing them worked. The host now advertises its active model slots when a client connects, and the client menu is built from that list. Requires host and client on 0.2.80+ (older pairings simply keep the old behavior)."}]}}, {"version": "0.2.79", "date": "2026-07-22", "sections": {"Fixed": [{"title": "No more confident answers from failed searches.", "detail": "When a web search (or any tool) errored, the model was still told to \"answer from the results\" — so it invented answers from stale memory and presented them as current (the World Cup incident: every search failed, and the 2022 final was recited as 2026 news). Now: failed tool results explicitly forbid substituting memory, and when *every* lookup in a turn fails the model is instructed to say so plainly and suggest retrying."}, {"title": "Searches now target the current year.", "detail": "Models anchor \"recent\" to their training years when composing queries (searching \"winner 2022 2023 2024\" in mid-2026). The current year is now baked into the search tool's description and the tool-use rules, so time-sensitive queries search the actual present."}, {"title": "Earlier thread answers are no longer treated as sources.", "detail": "The model is told that prior replies in a conversation may be outdated or wrong — for current events it must search fresh each time, not repeat an old answer."}]}}, {"version": "0.2.78", "date": "2026-07-16", "sections": {"Added": [{"title": "A third model slot: `/balanced`.", "detail": "Alongside fast and deep there's now a balanced slot — the middle ground: smarter than fast, quicker than deep. Type `/balanced` in chat (app or Telegram) to switch a conversation to it; `/help`, the slash menu, and the Telegram mode-switch messages all know about it. Configure it in Settings → Backend & model, same as the others."}], "Fixed": [{"title": "Each model slot now gets its own context budget.", "detail": "Prompt trimming and the generation-token budget followed the *fast* slot's context window even when a turn routed to deep — a 32k deep model was budgeted as if it had fast's window. Every turn now budgets against the slot actually serving it."}, {"title": "Fresh installs no longer start with a phantom deep model.", "detail": "A defaulting bug marked the deep slot active (pointing at the fast model) on brand-new configs before any wizard ran; extra slots now start empty and disabled."}]}}, {"version": "0.2.77", "date": "2026-07-03", "sections": {"Added": [{"title": "A real first-run setup wizard.", "detail": "New installs now open with a welcome screen — headline promise: every family member's conversations are sealed to them, invisible to everyone else including whoever runs the host — followed by a guided, installer-style setup: family & names, connect your AI (auto-detects Ollama/LM Studio/llama.cpp/vLLM on this machine and the LAN, with a real \"send a test message\" check), deep model, vision, web search & tools, image generation, Telegram bot, voice, Quick Chat & appearance, and a first family invite (QR + code). **Every step is skippable**, explains itself in plain language, spells out the consequence of skipping, and saves the moment you continue — quitting mid-setup loses nothing. The finish screen lists everything configured or skipped with the exact Settings page for each; skipping the AI step ends on a clear warning that KinAI can't answer until a model is connected, with the fix path. The welcome screen never appears again once setup completes — and existing installs are auto-marked complete, so **nobody already running KinAI ever sees the wizard**."}, {"title": "\"Send a test message\" backend check", "detail": "(`test_llm_endpoint`) — the wizard proves your model actually answers before you commit to it."}], "Fixed": [{"title": "`pnpm dev` (browser dev mode) works again", "detail": "— Vite's dependency pre-bundler was still targeting 2020-era browsers, which esbuild 0.28 can no longer downlevel to; dev mode hard-errored on modern Svelte syntax. Dev-mode browser sessions also get an in-memory IPC mock now, so the UI can be exercised without a running Tauri shell (dev-only; stripped from real builds)."}]}}, {"version": "0.2.76", "date": "2026-07-03", "sections": {"Added": [{"title": "KinAI now keeps log files.", "detail": "Everything the host logs is written to daily files under `~/.kinai/logs` (self-pruning: 7 days / 50 MB), so a problem from yesterday is diagnosable today — previously logs went to a console nobody could see. Settings → About has a new **\"Open logs\"** link; attach the latest file to bug reports."}], "Fixed": [{"title": "Small-context models get their memory back.", "detail": "On models with an 8k context window (like the README's suggested starter model), the prompt budget could collapse to zero — the model saw no history or memory at all and seemed inexplicably forgetful. The prompt now always keeps at least a quarter of the context window."}, {"title": "Private files are now private.", "detail": "`~/.kinai` (config with API keys and the Telegram token, the chat database, signing keys — including the update signing key) was world-readable on multi-user systems. Permissions are clamped on every launch, including the first."}, {"title": "Turns in image-heavy threads are much lighter.", "detail": "The context builder was re-reading and re-parsing every image ever sent in a thread (measured: 75 MB of an 81 MB database) on each turn, only to discard them. History image payloads are now stripped at the database layer — PDFs still pass through so follow-up questions about uploaded documents keep working, and thumbnails in the chat are unaffected."}, {"title": "Staged updates no longer accumulate forever.", "detail": "The host keeps the newest two versions (plus anything still referenced for slower-updating platforms) instead of every release ever staged — measured 3 GB reclaimed."}]}}, {"version": "0.2.75", "date": "2026-07-02", "sections": {"Fixed": [{"title": "Watching the deep model think no longer lags or freezes the app.", "detail": "The expanded \"Thinking…\" panel re-rendered the entire chain-of-thought (often hundreds of KB) on every incoming token, which bogged the window down until the panel was collapsed. While streaming, the panel now updates at most a few times per second and renders only the newest slice of the trace (the full text appears once thinking finishes) — smooth no matter how much the model thinks."}, {"title": "The thinking view now follows the newest thought.", "detail": "The trace used to grow faster than you could scroll (\"can't reach the end\"). The panel stays pinned to the bottom while streaming; scroll up to read something and it stops following, scroll back down and it re-engages."}, {"title": "Family members no longer get a blank reply when the deep model over-thinks.", "detail": "The fixes for empty completions (0.2.74) and fabricated image links (0.2.73) applied to the host's own chat and Telegram, but not to connected family clients — a deep turn that spent its whole budget reasoning landed as no answer at all on a client. Client conversations now get the same treatment: a clear retry note instead of nothing, and dead image links are recovered."}]}}, {"version": "0.2.74", "date": "2026-06-30", "sections": {"Fixed": [{"title": "Clearer messages when a model isn't ready or can't answer.", "detail": "Raw backend errors are now plain-language and actionable, especially for the big `/deep` model as it starts up: - Still loading (HTTP 503) → \"⏳ The model is still loading — give it a few seconds and try again.\" - Server unreachable → \"🔌 I couldn't reach the model server — it may be starting up or offline. Check that it's running, then try again.\" - Timed out / went silent → \"⏱ The model didn't respond in time…\" - An **empty completion** no longer forwards as Telegram's cryptic \"Bad Request: message text is empty\" (or a blank bubble in the app) — it shows a short retry note. - The \"ran tools but never produced an answer\" note is now plain language (\"I searched but couldn't pull together a clear answer…\") instead of mentioning \"max-rounds limits\" and \"tool-calling loops.\""}]}}, {"version": "0.2.73", "date": "2026-06-30", "sections": {"Fixed": [{"title": "\"Show me a picture of X\" no longer shows a broken image.", "detail": "Small chat models often fabricate a plausible-looking image URL instead of calling the `image_search` tool, so the link 404'd. The host now verifies every image the model embeds and, when a URL is dead, recovers a real one via `image_search` on the caption (dropping it only if nothing can be found) — in the app and on Telegram. The model is also told more firmly to use the tool and never invent image URLs."}, {"title": "Voice messages get a real answer again.", "detail": "The transcript was handed to the model with a 🎙 emoji prefix, which a small model reads as \"audio I can't process\" and refuses (\"I can't interpret voice messages\"). The model now gets the plain transcript; the Telegram echo still shows it came from voice."}, {"title": "Questions you ask in the KinAI app now mirror to Telegram.", "detail": "Telegram→app already worked, but app→Telegram silently didn't: the echo only fired for the deterministic `telegram-…` thread id, while the bridge actually routes into the peer's *active* thread (often a normal app thread). The echo now keys off the same active thread the router uses, so the conversation stays in sync both ways."}, {"title": "The voice-input \"Enabled\" toggle is no longer impossible to find.", "detail": "It was shown only when STT was already enabled-and-downloaded — a catch-22 that left it hidden while disabled, so you couldn't turn it on. It now appears whenever a voice model is downloaded."}]}}, {"version": "0.2.72", "date": "2026-06-30", "sections": {"Fixed": [{"title": "\"Show me a picture of X\" now sends a real photo on Telegram.", "detail": "A web `image_search` result is embedded as `![](url)` markdown — the app renders it inline, but Telegram strips image markdown, so you only got the caption text. The bridge now downloads the image on the host and sends it as an actual Telegram photo (validating it's really an image first, trying a few hits if some are page URLs). `/pic` already worked; web image results now match it."}, {"title": "Voice input turns on when you download the model.", "detail": "Downloading a Whisper voice model now auto-enables voice input (and selects that model), instead of leaving it downloaded-but-disabled — which silently rejected Telegram voice messages. The bot's \"I can't listen yet\" message also now points to the correct place (Settings → **Voice input**, not Voice replies)."}]}}, {"version": "0.2.71", "date": "2026-06-30", "sections": {"Fixed": [{"title": "Drag-and-drop a photo into chat now works.", "detail": "The drop was being swallowed by Tauri's native file-drop handler (you'd see the green \"+\" cursor but the image never landed) instead of reaching the chat's drop zone. KinAI now hands drops to the in-app handler, so images attach. Paste already worked; drag-drop now matches it."}, {"title": "Vision turns only send the image you just attached.", "detail": "KinAI was re-sending *every* image in the thread on each vision turn, so a handful of pictures piled into a request that 413'd hosted providers (Groq's size cap) and made local models grind for minutes in multi-image prefill before any output — surfacing as \"no reply\" or a failover that then went silent. A vision Q&A now carries just the current image; earlier images are summarized away."}, {"title": "Large photos are downscaled before sending.", "detail": "Images are resized to ≤1568 px on the longest edge (the resolution every major vision model treats as full detail) before base64-encoding, keeping individual requests well under cloud size caps. Local backends are unaffected; already-small images and PDFs pass through untouched."}], "Changed": [{"title": "Vision failover is smarter.", "detail": "A primary vision endpoint that fails with a retired-model error (decommissioned / not found) or a too-large rejection now falls over to the configured failover endpoint instead of returning nothing — so a cloud model getting pulled out from under your config auto-falls-back to, say, your local model."}, {"title": "Vision/LLM turns that produce no content are now logged on the host", "detail": ", so a silent failure is debuggable from the log instead of invisible."}]}}, {"version": "0.2.70", "date": "2026-06-29", "sections": {"Added": [{"title": "Fully-local vision is now first-class.", "detail": "Point the vision endpoint at any OpenAI-compatible server on your LAN — llama.cpp (`llama-server`), LM Studio, Ollama, or vLLM — and images never leave your network. The vision settings now **explain each field inline** (Base URL, Model, API key) instead of pre-filling provider presets: you configure your own endpoint with no guesswork, and the API-key field is optional — leave it blank for a local server. Qwen-VL (Qwen2.5-VL / Qwen2-VL / Qwen3-VL) is also recognized as a vision-capable *chat* model now, so a single local multimodal model can answer both text and image questions."}, {"title": "Settings can't be left unsaved by accident.", "detail": "When you have unsaved changes, the \"Back to chat\" button in Settings turns into a highlighted **\"Save & close\"** button — clicking it saves first, then returns you to the chat, so edits can't be lost by navigating away. It reverts to \"Back to chat\" once everything's saved."}, {"title": "Swap vision endpoints with one click.", "detail": "A \"Swap with primary\" button on the failover endpoint flips the primary and failover vision models, so you can promote your backup to the main model (or demote the main one) without retyping any URLs, models, or keys."}], "Changed": [{"title": "Vision settings no longer ship quick-fill presets.", "detail": "The provider preset buttons (which pre-filled specific cloud/local endpoints) were removed from both the Settings page and the host setup wizard in favor of clear per-field explanations. Nothing is hardcoded; every user enters their own endpoint."}], "Fixed": [{"title": "\"What's new\" update notes are now readable on Linux.", "detail": "The modal card was only 5% opaque and relied on a backdrop blur that WebKitGTK (Linux) doesn't render, so the chat showed through and the text was hard to read. The card now uses a solid, theme-aware background."}, {"title": "A blank API key no longer sends a broken `Authorization` header.", "detail": "KinAI now omits the header entirely when the key is empty (vision *and* chat endpoints), so local servers that reject `Bearer ` with no token work out of the box."}, {"title": "Revoked and expired invite codes no longer pile up forever.", "detail": "The invite list kept every code you'd ever revoked — greyed out, with no way to clear them. Now a code that has been revoked or expired for more than a week is swept automatically the next time the invite page loads. A freshly revoked code still lingers for the grace week as a visible \"this is dead\" record, then disappears. (Internally: a new `revoked_at` column measures the grace window from when you revoked the code, not when it was first issued, so revoking an old never-expiring invite doesn't make it vanish on the spot.)"}]}}, {"version": "0.2.69", "date": "2026-06-27", "sections": {"Added": [{"title": "\"Test vision\" button for the failover endpoint", "detail": "in Settings → Vision. The primary vision endpoint had one; the failover didn't, so there was no way to verify your backup vision model (key + URL + model) without actually triggering a failover. Each slot now shows its own independent ✓/✗ result."}, {"title": "Groq Llama-4 Scout vision preset", "detail": "— free, multimodal, OpenAI-compatible. One tap fills in the right base URL (`https://api.groq.com/openai`) + model (`meta-llama/llama-4-scout-17b-16e-instruct`); just paste a free key from console.groq.com/keys."}], "Fixed": [{"title": "Vision via Groq now works in chat.", "detail": "KinAI was passing the chat model's large `max_tokens` (derived from a 32k context) to the vision endpoint; Groq's Llama-4 vision caps output at 8192 and rejected it (`max_tokens must be less than or equal to 8192`). Vision turns now cap output at 4096 — ample for image Q&A, and under every provider's ceiling."}, {"title": "Vision test probe", "detail": "uses an 8×8 image instead of 1×1 — Groq rejects a 1-pixel image (`Image must have at least 2 pixels in each dimension`), which made the new test button report a false ✗ even on a working endpoint."}, {"title": "\"Claude 3.5 Haiku\" vision preset", "detail": "base URL corrected to `https://api.anthropic.com` — the old `…/v1` double-pathed into a 404 once KinAI appended `/v1/chat/completions`."}]}}, {"version": "0.2.67", "date": "2026-06-26", "sections": {"Fixed": [{"title": "Deep model no longer dies mid-answer on long replies.", "detail": "The LLM client had a 180-second total-request cap, so a slow reasoning model (the deep slot) that ran past three minutes got its stream killed — `error decoding response body`. Streaming requests are now uncapped; liveness is enforced by a per-chunk inactivity timeout (5 min of silence = treated as a stalled connection) and the Stop button. Non-streaming calls keep a finite ceiling."}, {"title": "A reply that's cut off mid-stream is kept, not thrown away.", "detail": "If the connection breaks after the model already streamed part of an answer, KinAI now shows that partial answer with a \"reply cut off\" note instead of replacing the whole turn with an error."}], "Changed": [{"title": "Readable Telegram replies.", "detail": "Telegram renders no markdown on our sends, so tables came through as unreadable walls of `|` and `-`. KinAI now flattens markdown for Telegram: tables become `• Header: value` bullet lists, headings/bold/italic markers are dropped, and `[text](url)` becomes `text (url)` so sources stay tappable."}, {"title": "Less made-up information.", "detail": "Web search now pulls 10 results (was 5), and the system prompt explicitly tells the model to ground every fact in the tool results, never invent URLs, and say so plainly when the search didn't answer the question — rather than filling gaps with plausible-sounding (fabricated) scores, dates, and sources."}]}}, {"version": "0.2.66", "date": "2026-06-25", "sections": {"Added": [{"title": "⌨ Ask while it's thinking — messages queue.", "detail": "Typing a second question while a reply is still streaming no longer does nothing. The follow-up is shown as a \"Queued · sends next\" chip and goes out automatically the moment the current turn finishes; queue as many as you like and they send in order. Each chip has an × to drop it, and pressing **Stop** clears the queue (Stop never kicks off a new turn on its own). Works in the main window and the Cmd/Ctrl-Space quick-chat overlay. Queued messages remember which conversation they were typed in, so switching threads while one waits still delivers it to the right place."}, {"title": "↑ / ↓ recalls earlier prompts.", "detail": "Press ↑ in the message box to step back through prompts you've sent this session and ↓ to come forward — the same history navigation you get in a terminal or Claude Code. ↑ only triggers when the cursor is at the start of the box, so multi-line editing still works. Available in both the main composer and the overlay."}, {"title": "⏹ Stop button everywhere.", "detail": "You can now halt a running reply — and break a runaway/looping generation — without restarting the app. Previously Stop only worked in the host's main window; now: - The **overlay** (Cmd/Ctrl-Space quick chat) has a Stop button. - **Client apps** (Mac, Windows, Linux) can stop too: Stop now forwards a cancel to the host over the WebSocket, which aborts the in-flight turn (the host registers a cancel token per client turn). Before, a client's Stop did nothing to a host-side loop. - Cancellation aborts mid-stream — including a degenerate token loop — not just between tool rounds."}], "Fixed": [{"title": "Linux clients update from the host over the LAN", "detail": ", like Mac and Windows (raw AppImage served + auto-staged); GitHub remains the off-LAN fallback. All three platforms now share one update model."}, {"title": "Release CI builds the platform jobs serially so they can't clobber each other's uploads (which had left past releases mi", "detail": ""}]}}, {"version": "0.2.64", "date": "2026-06-18", "sections": {"Added": [{"title": "🐧 Linux client (beta).", "detail": "KinAI now builds a Linux client (AppImage / .deb / .rpm) that joins a host and chats like the Mac and Windows clients — verified connecting + chatting on Fedora KDE (Wayland). The host serves Linux clients their LAN updates like the others. Voice input/replies remain host-only (macOS). Beta caveats: the global-hotkey overlay (`Ctrl+Space`) and the tray icon may not work under Wayland (platform restrictions) — the main window is unaffected."}, {"title": "Linux rendering hardening.", "detail": "WebKitGTK's Skia renderer crashes on COLRv1 color-emoji glyphs; KinAI now disables the DMABUF renderer and rejects color fonts on Linux (emoji render monochrome) so a reply containing emoji can't take down the window."}], "Security": [{"title": "Build toolchain: forced esbuild ≥ 0.28.1 and bumped Vite to 6.4.3, clearing three Dependabot advisories (all dev-tooling", "detail": ""}]}}, {"version": "0.2.63", "date": "2026-06-11", "sections": {"Added": [{"title": "🔊 Voice replies on family Macs (clients).", "detail": "The speak button, auto-speak, and the `/voice` toggle now work in every Mac client's chat window — replies are synthesized and played locally with that Mac's own voices (each member picks theirs in Settings → Voice replies, with previews). Nothing routes through the host; it's fully private to the machine. Telegram voice notes are unchanged (toggle with `/voice` in Telegram). Windows clients: not yet — the Windows speech engine is a future addition."}]}}, {"version": "0.2.62", "date": "2026-06-10", "sections": {"Added": [{"title": "🎙 Voice input — talk to KinAI on Telegram.", "detail": "Send the bot a voice message and it answers like a typed question: the audio is transcribed **on the host Mac** with Whisper (fully local, German and English auto-detected, Metal-accelerated on Apple Silicon). The bot echoes what it understood («…»), the exchange lands in the KinAI thread, and with `/voice` on, the answer comes back as a voice note — a complete spoken conversation with your own local AI. - Setup is one click: Settings → Voice replies → Voice input → **Download** (Standard ~190 MB or High-accuracy ~574 MB; switch anytime). Nothing else to install — audio decoding uses macOS built-ins. - Family members need nothing: they just hold the mic button in Telegram and talk."}, {"title": "`/voice` appears in the slash autocomplete menu.", "detail": ""}], "Fixed": [{"title": "Slash commands can be sent with the keyboard again.", "detail": "The autocomplete menu kept re-completing the command on every Return, so bare commands (`/help`, `/newchat`, `/voice`, …) could only be sent by clicking SEND. Now the first Return completes the command and the second Return sends it."}]}}, {"version": "0.2.61", "date": "2026-06-10", "sections": {"Added": [{"title": "🔊 Voice replies.", "detail": "KinAI can now speak its answers — fully local, powered by macOS speech synthesis on the host, no cloud and no extra installs. `/voice` toggles spoken replies **for the chat you're in**: - **Telegram:** send `/voice` to the bot and answers arrive as text plus a real voice note (OGG/Opus waveform bubble; per family member, from any phone). Turning it on confirms with a spoken voice note. `/voice on` / `/voice off` set it explicitly. - **KinAI chat (host Mac):** type `/voice` and replies are read aloud automatically from then on — the ON confirmation speaks itself, the OFF one stays silent. A \"speak/stop\" button on every reply plays any answer on demand either way. Same switch as Settings → Voice replies → \"Speak automatically\". - **Settings → Voice replies (host):** master switch, separate English and German voices with ▶ preview buttons, and step-by-step instructions for downloading Apple's free Premium voices (they sound far better than the defaults). - Replies are auto-detected as German or English and use the matching voice; markdown/code is stripped before speaking, and `/pic` photo replies are never read aloud."}, {"title": "Voice messages get a real answer.", "detail": "Sending a recorded voice message no longer disappears into silence — the bot explains it can't transcribe yet, and the exchange shows up in the KinAI app's thread like everything else. (Speech-to-text is on the roadmap.)"}], "Changed": [{"title": "Settings closes itself after saving.", "detail": "\"Save changes\" shows ✓ saved, then returns to the chat automatically."}]}}, {"version": "0.2.60", "date": "2026-06-10", "sections": {"Added": [{"title": "Regenerate a reply.", "detail": "A \"regenerate\" button on the last assistant message re-rolls the answer — the old reply is replaced by a freshly streamed one. (Host mode)"}, {"title": "Edit & resend.", "detail": "An \"edit\" button on your own messages opens an inline editor (⌘↩ to save, Esc to cancel); saving rewrites the message, drops everything after it, and re-runs the conversation from there. (Host mode)"}, {"title": "Cross-thread search.", "detail": "A search box at the top of the sidebar finds any message across all your conversations — full-text, ranked, and matching as you type (\"inve\" finds \"investment\"); clicking a result jumps straight to that message and highlights it. Each family member can only ever search their own messages. (Host mode)"}, {"title": "Telegram replies now stream.", "detail": "Instead of waiting for the full answer, the bot posts a draft and live-edits it as the model writes — the familiar ChatGPT-style build-up."}, {"title": "Telegram `/pic` shows \"🎨 Creating a picture…\"", "detail": "while the image generates (5–110s), and the note disappears the moment the photo lands — replacing the misleading built-in \"sending a photo…\" label."}], "Fixed": [{"title": "Replies no longer get silently truncated.", "detail": "The stream parser could slice a buffer at a byte offset landing inside a multi-byte character (emoji / CJK / accented Latin — common in normal output), panicking the pump task and cutting the answer short (or blank) on every chat surface. Now char-boundary-aligned."}, {"title": "A crafted `/pic` no longer crashes the Telegram bot.", "detail": "`parse_slash` derived a slice index from a lowercased copy; a character whose lowercase has a different byte length (e.g. `İ`) underflowed and panicked, killing the bot's poll loop for the whole family. Fixed."}, {"title": "Overlay no longer spins \"Thinking…\" forever.", "detail": "It now handles a dropped host connection and backend errors (clears the busy state), and `/newchat` aborts if the new thread can't be created instead of sending your \"fresh\" question into the old conversation."}, {"title": "Telegram pairing poll is cleared on leaving Settings (was firing for up to 11 minutes); tool-status pills update reliabl", "detail": ""}, {"title": "Telegram `/pic` no longer goes silent during generation.", "detail": "The slash path returned before the chat typing keep-alive was set up, so the user saw no \"working…\" signal at all (superseded by the \"creating a picture…\" placeholder above)."}, {"title": "The assistant message footer keeps `prompt · copy · regenerate` together on one line instead of scattering when the metr", "detail": ""}, {"title": "One slow command no longer freezes the whole Telegram bot.", "detail": "The poll loop awaited each update inline, so a slow `/picHQ` (ComfyUI generation, up to minutes) blocked `getUpdates` entirely — every other family member's messages piled up unanswered until it finished. Each update is now handled in its own task, so the bot stays responsive (and a panic in one update can't tear down the loop)."}], "Performance": [{"title": "Context trimming on long threads is now O(n) instead of O(n²) (token costs computed once, not re-tokenized every loop it", "detail": ""}], "Internal": [{"title": "Host now prefers the NSIS Windows installer over the MSI when serving updates (the MSI could no-op on a matching version", "detail": ""}]}}, {"version": "0.2.59", "date": "2026-05-30", "sections": {"Fixed": [{"title": "`/newchat` now appears in the Telegram slash menu.", "detail": "0.2.58 added the command and its `/help` entry but not the bot's registered command list (`setMyCommands`), so it didn't show in Telegram's `/` autocomplete. Added it to `default_command_menu()`; the menu re-registers when the host's bot restarts. (The menu is per-bot, so every family's own bot shows it automatically once their host runs this build.)"}]}}, {"version": "0.2.58", "date": "2026-05-30", "sections": {"Added": [{"title": "`/newchat` — start a fresh conversation.", "detail": "A new question shouldn't inherit the previous one's context, but the quick-chat overlay reuses your most-recent thread and Telegram keeps one thread per person, so stale context leaked in. `/newchat` now opens a brand-new thread with no prior context (your saved memory / facts are kept — they're persistent, not conversation context). Works in all three surfaces: the overlay (Option+Space), the main chat window (also in the slash autocomplete), and the Telegram bot. Add a question to ask it right away in the clean thread: `/newchat what's the capital of Japan?` Telegram tracks the active thread per peer (new `telegram_active_thread` table) so the rotation persists; existing pairings keep their history (no row = the previous deterministic thread). Tests: `src/telegram/router.rs` (`newchat_tests`)."}]}}, {"version": "0.2.57", "date": "2026-05-30", "sections": {"Added": [{"title": "Updates now reach overlay-only users.", "detail": "The update banner only ever rendered in the main window, so anyone who lived in the Option+Space quick-chat bar would never be told about — or able to install — a new version. The overlay now shows its own **\"Update available — vX.Y.Z · click to install & restart\"** pill (same install-and-restart flow as the main banner, with download progress)."}], "Changed": [{"title": "Updates surface without a restart.", "detail": "The background update check ran only at launch and every 4 hours, so a long-running window could sit on a stale version until restarted. Now both the main window (on focus) and the overlay (each time it opens) re-check for updates — throttled to once a minute — so a new release shows up promptly."}]}}, {"version": "0.2.56", "date": "2026-05-30", "sections": {"Fixed": [{"title": "Windows auto-update no longer loops on the same version.", "detail": "Windows clients were stuck (e.g. on 0.2.48) while the banner kept advertising the latest version: the host advertised the newest *staged* version but served a **stale, older installer** under that version's folder, so Windows Installer saw the same version already installed and no-op'd. Root cause: nothing built a current-version Windows installer per release — `release.yml` was macOS-only and `test-windows.yml` only ran on manual dispatch, so `deploy.sh` fell back to a stale artifact. Fixes: - **`release.yml`** now builds, signs, and publishes the Windows installer for every tag (added a `windows-latest` job), and `tauri-action` merges it into the release's `latest.json` — so the updater serves a correctly-versioned, signed Windows build from the same manifest as macOS. - **`deploy.sh`** stages the Windows bundle only from the matching release (the stale `test-windows.yml` fallback that caused the skew is gone), prefers the NSIS `-setup.exe` installer, clears any previously-staged installer, and adds a `stage-windows` re-stage mode for the post-publish step."}]}}, {"version": "0.2.55", "date": "2026-05-29", "sections": {"Changed": [{"title": "Settings polish.", "detail": "Tidied the Settings header/footer so it reads like a shipped product: the build line drops the raw target and the informal relative time — `macos-aarch64 · … (58 min ago)` becomes `macOS · Apple silicon` with the commit + a clean date on a quiet second line (clicking it still copies the full build identifier for support). Project links are now consistent and uncluttered — `Website · GitHub · @gogo6969` instead of the raw Replit domain and a wordy \"Follow on X\" label."}, {"title": "Overlay setting wording.", "detail": "Renamed the toggle \"Auto-hide when I click elsewhere\" → \"Auto-hide when clicking elsewhere\" (drops the casual first-person phrasing)."}]}}, {"version": "0.2.54", "date": "2026-05-29", "sections": {"Added": [{"title": "Global hotkey is now a recorder, not a text field.", "detail": "In Settings → Overlay, click the Global hotkey field and just *press* your combination — it's captured and shown as a valid accelerator (e.g. `CmdOrCtrl+Shift+K`) instead of having to type it character by character. Uses the physical key code so a held Option/Alt on macOS doesn't turn the key into a stray character; requires a modifier (or a standalone function key); Esc cancels. A \"Type manually\" toggle keeps raw text entry for power users / unusual keys."}], "Security": [{"title": "Bumped `tar` 0.4.45 → 0.4.46", "detail": "(GHSA-3pv8-6f4r-ffg2, \"PAX header desynchronization\", moderate). Pulled in transitively via `tauri-plugin-updater`. Lockfile-only, semver-compatible."}], "Changed": [{"title": "Clearer, correct image-generation setup help.", "detail": "The Settings → Image generation hint was both Olares-One-centric (misleading — ComfyUI is cross-platform and runs on Linux, Windows, or any Mac) and incomplete: it listed only the two `z_image` diffusion models, but the `/pic` and `/picHQ` workflows also require the shared text encoder (`qwen_3_4b.safetensors`) and VAE (`ae.safetensors`) — without them ComfyUI fails with node errors. The hint now states ComfyUI is cross-platform and includes an expandable \"What needs to be installed?\" guide listing all four model files with their target folders, the `--listen 0.0.0.0` bind requirement, and a note that no custom nodes are needed (just a recent ComfyUI)."}]}}, {"version": "0.2.53", "date": "2026-05-28", "sections": {"Fixed": [{"title": "Network scan now finds LLM servers running on \"the next port over.\"", "detail": "Discovery TCP-scanned a sparse, hand-picked list of 27 ports, so a backend on any port between the picks was invisible — e.g. a second llama.cpp instance on `8083` (the old list had `8082` then jumped to `8088`). The port set is now generated from dense contiguous ranges around each backend's base — Ollama `11434–11439`, LM Studio `1234–1237`, vLLM `8000–8010`, llama.cpp `8080–8095`, text-gen/Kobold `5000–5005` — plus well-known defaults it never probed: SGLang `30000`, Jan `1337`, TGI `80`, Aphrodite `2242`. Phase-1 scan concurrency was raised 64 → 256 so the larger set doesn't slow the scan down. Verified against a live LAN: KinAI now discovers backends on `8083` (and the other dense-range ports) that the old scan walked right past."}, {"title": "Network scan no longer exhausts file descriptors and finds nothing.", "detail": "macOS launches GUI apps with a 256 open-file soft limit, and KinAI already holds ~100+ fds (webview, DB, WebSocket clients) at idle. A wide scan fan-out then blew past 256 and every probe failed with `EMFILE` — the scan silently returned zero results. The scanner now sizes its concurrency to the fd budget actually in effect, and KinAI raises its own `RLIMIT_NOFILE` toward 8192 at startup (which also protects a busy host serving many family clients). Verified under a simulated 256-fd limit: the scan backs off and still discovers every backend. Tests: `src/llm/detect.rs` (`port_coverage_tests`, incl. concurrency bounds) and an `#[ignore]`d live probe `tests/discovery_live.rs` that runs the real `scan_local_network()`."}]}}, {"version": "0.2.52", "date": "2026-05-28", "sections": {"Fixed": [{"title": "KinAI now knows what day it is.", "detail": "Local models have a training cutoff and no built-in sense of \"now,\" so KinAI would insist a recent or in-progress event \"hasn't happened yet\" — e.g. reporting the French Open currently underway as still \"scheduled.\" The system prompt now injects the host's current date and time on every turn and instructs the model that everything up to today has already happened, and to use `web_search` for live facts (results, news, prices) instead of guessing from stale knowledge. The `datetime()` tool alone wasn't enough — a model that wrongly believes it already knows the answer never thinks to call it. Test: `src/context/mod.rs` (`system_prompt_tests`)."}]}}, {"version": "0.2.51", "date": "2026-05-28", "sections": {"Fixed": [{"title": "Sending an image to analyze on Telegram works again.", "detail": "The Telegram router only ever read a message's text/caption — it silently dropped `msg.photo`, so photos sent to the bot did nothing. Inbound photos are now downloaded (highest-resolution size), wrapped as an image attachment, and routed through the same vision pipeline the desktop app uses (configured Vision endpoint — e.g. Gemini 2.5 Flash with Claude failover). A photo with no caption gets a default \"What's in this image?\" prompt."}, {"title": "`/deep` no longer dies in a thread that earlier contained an image.", "detail": "This was the real cause behind \"Something went wrong\" on the long deep thread (on top of the v0.2.50 budget fix). The router/route only inspects the CURRENT turn's attachments, so a text follow-up correctly routes to the chat model — but `build_context` still carried the earlier image from history and serialized it into multipart content, which a non-vision backend (llama.cpp without an `mmproj` projector — exactly the deep slot's Qwen3) rejects with `500: image input is not supported`. Historical images are now replaced with a short text marker before a non-vision model sees them, so the turn succeeds and the conversation still notes an image was there. Tests: `src/vision.rs` (`image_strip_tests`) and `src/telegram/router.rs` (`photo_tests` — largest-size selection)."}]}}, {"version": "0.2.50", "date": "2026-05-28", "sections": {"Fixed": [{"title": "Switching to `/deep` deep into a long thread no longer fails silently.", "detail": "v0.2.49 reserved a flat 8192 generation tokens, which fixed fresh threads but a long thread still starved the reasoning model — 8k tokens isn't enough to think over ~24k of context AND answer. `build_context` now reserves HALF the context window for generation (≈16k on a 32k window), capping the prompt near 16k. Verified: a window-filling 60-message thread now leaves 16786 tokens of generation headroom (was ~0 originally, ~8k in v0.2.49). Switching from fast to deep mid-conversation works regardless of how long the thread has grown."}, {"title": "Bare `/deep` (and `/fast`) now switches models instead of doing nothing.", "detail": "Typing `/deep` and Enter — with no prompt after it — used to send an empty message to the model and produce junk or silence. Now it's a proper mode switch: it flips the thread to the deep model (sticky for follow-ups), replies with a confirmation naming the model (\"Switched to the deep model (`Qwen3.6-35B…`)…\"), and skips the LLM turn entirely. Same for `/fast`. You can switch with just `/deep` ⏎ the way you used to. Tests: `tests/routing.rs` (bare switch is sticky; `/deep test` still runs a normal turn; confirmation names the model) and `tests/context_budget.rs` (half-window headroom holds on a full thread)."}]}}, {"version": "0.2.49", "date": "2026-05-28", "sections": {"Fixed": [{"title": "The deep model no longer \"thinks for a second then goes silent.\"", "detail": "This was a generation-budget collapse, distinct from (and on top of) the v0.2.47 `reasoning_content` fix. `build_context` trimmed the prompt to `context_window - max_tokens`. With `max_tokens = 0` (auto — the default, and what reasoning models need), that's the FULL context window, so once a thread accumulated enough history the prompt packed right up to the limit and left ~0 tokens for generation. `compute_max_tokens` then floored at 256. A non-reasoning model (gpt-oss on the fast slot) survives a 256-token budget — it emits the visible answer immediately. A reasoning model (Qwen3 on the deep slot) spends its entire budget on the `<think>` phase, hits `finish_reason=length`, and produces EMPTY visible content. Same prompt, same budget, opposite outcome — which is exactly why the fast slot worked and the deep slot didn't, and why it only broke after the thread grew long. Fix: `build_context` now reserves 8192 tokens of generation headroom when `max_tokens` is auto, instead of letting the prompt consume the whole window. The deep model now gets ~8k+ tokens to think and answer. Proven with four tests (see `tests/deep_model_live.rs` and `tests/context_budget.rs`): - live: deep model streams reasoning + a real answer through the full pipeline, with and without tools - live: 64-token budget → empty (the bug); 8064-token budget → \"144\" (the fix) — isolates the budget as the cause - offline: build_context with a window-filling thread leaves 8351 tokens of generation headroom (was ~0)"}]}}, {"version": "0.2.48", "date": "2026-05-28", "sections": {"Fixed": [{"title": "Auto-update now actually reaches everyone stuck on 0.2.47, and the Settings version chip shows the correct commit.", "detail": "Two coupled build-system bugs: 1. **`build.rs` cached the git commit hash.** It only declared `cargo:rerun-if-changed=src`, so the embedded short-hash was re-queried *only* when a file under `src/` changed. Committing doesn't change file mtimes, so a rebuild right after `git commit` embedded the PREVIOUS commit's hash. That's how a v0.2.47 binary ended up reporting commit `458a300` (the v0.2.46 commit) despite having v0.2.47's source compiled in. Now build.rs also watches `.git/HEAD` and the ref it points to, and `scripts/deploy.sh` touches `src/main.rs` before building as belt-and-suspenders. 2. **The fix couldn't ship via auto-update.** The broken-hash 0.2.47 binary reports version `0.2.47`; GitHub's latest was also `0.2.47`. Tauri's updater compares semantic versions, sees `0.2.47 == 0.2.47`, and concludes \"up to date\" — so it never pulled the corrected build. Bumping to **0.2.48** is the only way to make the version comparison trip and the update download. If you were stuck on a 0.2.47 that didn't behave right, 0.2.48 is what unsticks you. No functional code change beyond the build script — 0.2.48 carries the same deep-model `reasoning_content` fix as 0.2.47, now with a version number that auto-update will actually act on and a commit hash that tells the truth."}]}}, {"version": "0.2.47", "date": "2026-05-26", "sections": {"Fixed": [{"title": "The deep model (`/deep`) works again — KinAI now reads the `reasoning_content` streaming field.", "detail": "Reasoning models served via recent llama.cpp builds (Qwen3, DeepSeek-R1, etc.) split their chain-of-thought into a separate `reasoning_content` delta field instead of inlining it in `content`. KinAI's stream parser only recognized a field named `reasoning`, so every thinking token was silently dropped by the JSON deserializer — the model would spend 30–60 seconds reasoning while KinAI showed nothing but pulsing dots, then the final answer (which DOES arrive in `content`) would appear after the dead air. That dead air read as \"the deep model is broken.\" This wasn't a KinAI regression — it surfaced when the host's llama.cpp server was rebuilt/updated to a newer build that defaults to `--reasoning-format deepseek` (separated reasoning), versus older builds that kept it inline. Either way the right fix is on KinAI's side: added a serde alias so the `reasoning` field accepts both `reasoning` (vLLM-style) AND `reasoning_content` (llama.cpp / DeepSeek / Qwen3). The reasoning now streams live into the collapsible thinking panel for the deep slot, same as the fast slot. Three parser tests added (`reasoning_field_tests`) so a future backend using yet another field name fails CI loudly instead of silently swallowing the model's output."}]}}, {"version": "0.2.46", "date": "2026-05-26", "sections": {"Fixed": [{"title": "Pasting an image into the overlay (Cmd+Space quick chat) now works.", "detail": "The main app has handled paste-as-attachment since v0.2.32, but I never wired the same handler into the overlay. Pasting just produced empty text for a blob clipboard. Now the overlay has the same image / PDF paste path, a thumbnail strip beneath the input with hover-X to remove, the same 25 MB and PNG/JPG/GIF/WEBP/PDF limits as the main chat, and the window auto-resizes to fit the thumbnails. Attachments ride along with the prompt when you press Enter."}, {"title": "Mic \"Speech recognition is blocked\" no longer fires when there's simply no mic plugged in.", "detail": "macOS WKWebView's Web Speech API reports `not-allowed` for both \"permission denied\" AND \"no audio input hardware available\" — same error code, very different fixes. Users (rightly) hit the alarming permissions message and toggle

d System Settings panes they didn't need to touch. Added a pre-flight check via `navigator.mediaDevices.enumerateDevices()`: if zero audioinput devices are visible, show \"No microphone detected. Plug one in (or enable your built-in mic) and try again.\" instead. The permissions message now fires only when there ARE audio devices but the SR engine still refuses — i.e. the actual permission case. Also softened the wording on the permissions message itself (\"likely a missing permission\" instead of \"blocked\") so it sounds less scary if it's wrong for some other reason."}]}}, {"version": "0.2.45", "date": "2026-05-26", "sections": {"Fixed": [{"title": "Memory now refuses to silently store physically impossible claims.", "detail": "You told KinAI \"I am 10 feet tall\" and it dutifully saved `height: 10 feet` — no skepticism, no pushback. That's because the system prompt I shipped in v0.2.32 instructed the LLM to remember any stated fact unconditionally, and the passive extractor prompt did the same with even less context. Both have been updated: **Conversational path (the `remember` tool):** the system prompt now includes a \"PLAUSIBILITY CHECK\" section before the model is allowed to call `remember`. It must reject heights outside ~50–230 cm, ages outside 0–120, weights outside ~2–350 kg, supernatural identity claims (\"I am Batman\"), and hyperbolic numbers. When it spots one it pushes back in plain prose with the reason and waits for the user to confirm or correct. Only an explicit \"yes, save it anyway\" overrides — and even then it acknowledges it's storing something unusual. **Background extractor (passive pass):** the extractor prompt gains a \"PLAUSIBILITY GATE\" with the same ranges. Critically, the extractor cannot ask follow-up questions, so when in doubt it now excludes the fact entirely. False negatives (a real fact gets missed) are recoverable — the user can just say it again, or call `remember` through the chat. False positives (junk getting stored) corrupt the Memory page and require manual cleanup. Existing junk facts from before this release? Open Settings → Memory and click the trash icon on anything wrong. The model trusts what's stored, so cleaning the list improves all future conversations."}]}}, {"version": "0.2.44", "date": "2026-05-26", "sections": {"Fixed": [{"title": "macOS microphone works again on builds installed via auto-update or the GitHub Releases page.", "detail": "A subset of Mac users have been seeing \"Speech recognition is blocked…\" with no obvious cause. Root cause: my local `scripts/deploy.sh` does an explicit `codesign --entitlements entitlements.plist` step that applies the hardened-runtime entitlements (`audio-input`, `camera`, `allow-jit`), but the CI path through `tauri-action` did its own codesign without picking up our `entitlements.plist`. So builds shipped via CI (every GitHub release since the workflow was set up) had EMPTY entitlements — the hardened runtime denied microphone access at the kernel level regardless of what the user granted in System Settings. Verified by running `codesign -d --entitlements -` on the v0.2.42 CI bundle: no `audio-input` key present at all. Fix: declare `bundle.macOS.entitlements = \"entitlements.plist\"` in `tauri.conf.json` so the Tauri bundler — used in BOTH local deploy and CI — picks up the same entitlements file. No more drift between the two paths. Builds shipped from this release onward will have the `com.apple.security.device.audio-input` entitlement attached at codesign time. After upgrading, you may need to: 1. Quit + relaunch KinAI on the affected Mac 2. System Settings → Privacy & Security → Microphone → confirm KinAI is toggled on (it should already be from when you granted earlier) If the entitlement was the only blocker (likely), step 2 isn't needed — granting was preserved, the kernel just couldn't honor it before."}]}}, {"version": "0.2.43", "date": "2026-05-26", "sections": {"Fixed": [{"title": "Deleting a memory entry on a client no longer makes the screen flicker and time out", "detail": "with \"Couldn't load memory: timed out waiting for host's user_facts response.\" Three small fixes cooperate to kill the race: 1. The client's WS handler for `UserFacts` was emitting `kinai://user-facts-updated` on every response. The Settings → Memory page subscribes to that event and calls `load()` in response. So every delete/save fired two `load()` calls in parallel — the explicit `await load()` after the mutation, and the listener callback. The second `load()` displaced the first's parked oneshot in `user_facts_pending`, the first's receiver returned Closed, and the IPC waited the full 10s before timing out. The two competing renders also caused the visible flicker. Removed the client-side emit; the event is still legitimately fired on the host when its background extractor writes a new fact. 2. `client_user_facts_request` in `src/commands.rs` now refuses a second request when one is already in flight, returning a clear \"another memory request is already in flight\" error instead of silently overwriting the parked sender. Belt- and-braces against any future race that slips through. 3. The Memory page (`frontend/src/routes/settings/memory/ +page.svelte`) gains a shared `mutating` state that disables remove / commitEdit / clearAll / add during any in-flight mutation. Fast double-clicks now no-op instead of trying to fire a second IPC."}]}}, {"version": "0.2.42", "date": "2026-05-26", "sections": {"Added": [{"title": "Settings → Memory now works on clients (M2, Windows).", "detail": "Previously the Memory page on a client read the client's own local DB scoped to `HOST_PEER`, which was empty — even though the host had been storing per-peer facts under each client's id all along. Now the client's Memory page round-trips to the host over the WebSocket and gets back its own facts, scoped by the connecting peer's id. Four new envelopes carry this: - `ListUserFacts` — client requests its own facts - `SaveUserFact { key, value }` — manual add from the client UI - `DeleteUserFact { id }` — forget one fact - `ClearUserFacts` — \"Forget everything\" button on client - `UserFacts { facts: Vec<UserFact> }` — host's response to any of the above (always sends the full fresh list, so the UI re-renders off one envelope) Same data, same DB on the host, same per-peer scoping the LLM has always used at prompt-build time. The only thing that changed is that the client's UI can now SEE and EDIT what the host knows about it. Privacy invariant unchanged and now explicitly tested: every host-side handler uses `context_peer` (the connecting client's peer id, derived from the JWT — clients cannot supply a peer_id on the wire). One family member cannot see or modify another's facts via any path. Frontend code in Settings → Memory is unchanged — the Tauri command detects Client mode and routes through WS, so the UI doesn't know or care which mode it's in."}, {"title": "`src/db/user_facts.rs::tests`", "detail": "— four tests that exercise the peer-scope invariant directly against the DB layer: - `peer_scope_is_strict` — Alice's list doesn't include Bob's facts - `upsert_is_per_peer_not_global` — same key under two peers stays two rows - `delete_is_peer_scoped` — Bob trying to delete Alice's row by id is a no-op, not a cross-peer deletion - `clear_all_is_peer_scoped` — \"Forget everything\" wipes only the requesting peer, never anyone else These will catch the kind of refactoring accident that would silently expose another family member's memory (e.g. someone hardcoding `HOST_PEER` in a handler that should use `context_peer`)."}]}}, {"version": "0.2.41", "date": "2026-05-26", "sections": {"Fixed": [{"title": "CI: build frontend before `cargo test` runs.", "detail": "The v0.2.40 release tagged a CI run that failed in the new `cargo test` gate — `tauri::generate_context!()` is evaluated at compile time and panics the proc-macro when `frontend/build/` doesn't exist. The release.yml step ran `cargo test` BEFORE `tauri-action` got a chance to invoke `beforeBuildCommand` (which builds the frontend), so the test step couldn't compile. v0.2.40 was installed locally fine but never produced GitHub bundles. Fixed by inserting a `pnpm --filter kinai-frontend build` step ahead of `cargo test`. Same guard added to `scripts/deploy.sh` so a fresh-checkout local deploy also doesn't trip the macro. v0.2.41 is the first release that actually completes the new test-gated CI pipeline end-to-end."}]}}, {"version": "0.2.40", "date": "2026-05-26", "sections": {"Fixed": [{"title": "Every JWT operation was silently panicking on a tokio worker thread since v0.2.36.", "detail": "When I bumped `jsonwebtoken` from 9.3.1 to 10.3.0 in the dep-update pass, I missed that v10 made the crypto backend an explicit Cargo feature. The crate compiled cleanly without one, but at runtime every `encode()` and `decode()` call panicked with *\"Could not automatically determine the process-level CryptoProvider\"*. Because the panic happened on a worker thread (not the main thread), the host process kept running — it just couldn't do anything that touched JWTs. This single bug caused every confusing failure of the past few days: - **Create invite hung on \"Creating…\" forever** — `issue_token` panicked, the IPC handler never returned, the frontend's `await` never resolved. - **M2 Mac couldn't reconnect to the host** — the host couldn't validate M2's JWT, the WS handshake failed. - **The host's peers table stayed empty** — no client could complete auth, no peer row was ever written. - **Telegram pairing was broken** — same JWT validation path. Fixed by adding `features = [\"rust_crypto\"]` to the jsonwebtoken dependency in `Cargo.toml`. Pure-Rust crypto, no native deps, no runtime panic."}], "Added": [{"title": "`cargo test` now runs before every release.", "detail": "Added a JWT round-trip smoke test in `src/auth/mod.rs::tests` that issues a token, validates it, and confirms the claims match. If the crypto provider isn't wired up correctly, this test panics in CI in seconds. Wired into `scripts/deploy.sh` (runs before the build/sign/notarize chain) and `.github/workflows/release.yml` (runs before the Mac DMG step). Both stop the release if tests fail. Bypass with `KINAI_DEPLOY_SKIP_TESTS=1` only for genuine emergencies — exactly the kind of escape valve we should NOT have been using by default."}]}}, {"version": "0.2.39", "date": "2026-05-26", "sections": {"Fixed": [{"title": "\"Create invite\" no longer silently no-ops.", "detail": "The host's *Manage family → Invite a family member* page had three failure paths that all looked identical to the user (button clicked, nothing happened, no clue why): - Empty/whitespace label was a silent `return` — no error message - Backend IPC failures (DB locked, signing key unreadable, JWT encode error) were unhandled promise rejections that vanished into the console - No busy state, so a slow IPC looked indistinguishable from a broken button — users would click twice, three times, give up Now: empty label shows a visible \"Please enter a label…\" message inline; IPC errors render as a red banner with the actual error text; the button itself flips to \"Creating…\" and disables for the duration of the call so double-clicks are impossible."}]}}, {"version": "0.2.38", "date": "2026-05-23", "sections": {"Fixed": [{"title": "Telegram `/help` is properly formatted.", "detail": "Was rendering as a flat list of bullets with literal `**asterisks**` and `` `backticks` `` in the bubble — the markdown was being sent through Telegram's plain-text path, which doesn't interpret either syntax. Replaced with a Telegram-HTML version (sent via `parse_mode=HTML`) that: - groups commands into bold section headers (Models / Image generation / Info), - renders command names as inline `<code>` blocks, - uses one short line per command (no wraparound). The desktop chat still receives the original markdown form (and persists it to the DB) so its `marked`-rendered bubbles look the same as before. Only the Telegram presentation changed."}]}}, {"version": "0.2.37", "date": "2026-05-23", "sections": {"Fixed": [{"title": "`/pic` / `/picHQ` no longer dumps an HTML error page into your chat when ComfyUI is unavailable.", "detail": "When the upstream ComfyUI host returned a 503 with an HTML \"service unavailable\" page (Olares does this when the user's ComfyUI instance has been spun down), KinAI's error handler concatenated the entire 3 KB of inline `<style>` + `<script>` + `<div>` into the failure message — which then got rendered verbatim in the chat bubble. Ugly to read and a privacy leak (the Olares page embeds the user's admin subdomain URLs). Now wrapped through a `summarize_comfy_error` helper that: detects HTML by sniffing the body, tries to extract the `<h1>` or `<title>` so the user still sees a meaningful label (\"ComfyUI Unavailable\"), falls back to a canned message keyed off the HTTP status code (503 / 502 / 504), and caps any plain-text body at 300 characters. Five unit tests cover the cases."}]}}, {"version": "0.2.36", "date": "2026-05-23", "sections": {"Fixed": [{"title": "Windows auto-update was completely broken since v0.2.13", "detail": "with the error *\"Unsupported Zip Archive: Compression method not supported\"*. The Tauri 2.x updater plugin (`tauri-plugin-updater 2.10.x`) declares its `zip` crate dependency with `default-features = false` and adds no compression backends, so the bundled zip crate could not decompress DEFLATE — the compression method every `.msi.zip` uses. Every Windows client trying to install a KinAI update saw the banner, clicked it, and got the error with no path forward. Fix: stop wrapping the MSI in a zip at all. The Tauri 2.x updater accepts raw `.msi` files directly (its `extract_exe` → `infer::archive::is_msi` path detects them by magic bytes and invokes `msiexec` straight on the download). We now: - Stage the raw `.msi` (and `.msi.sig`) in the host's update directory instead of the zipped wrapper — see `scripts/deploy.sh`. - Resolve `KinAI.msi` first (then `KinAI.exe`, then legacy `KinAI.msi.zip`) in `src/network/updates.rs::bundle_filenames`. - Point GitHub's `latest.json[windows-x86_64].url` at the raw `.msi` with the `.msi.sig` signature, so clients hitting the GitHub fallback skip the broken zip path too. Hot-patched v0.2.35 already: anyone stuck on the \"Unsupported Zip Archive\" error gets unstuck the next time their updater polls (within ~1 hour, or immediately when they click the banner again). Newer versions are durable — no more zip wrapping anywhere in the Windows pipeline."}]}}, {"version": "0.2.35", "date": "2026-05-22", "sections": {"Changed": [{"title": "Tray icon is now the actual KinAI logo, not a featureless square.", "detail": "The old `public/icons/tray.png` was a 32×32 copy of the full-color app icon WITH the dark navy background — but `iconAsTemplate: true` in `tauri.conf.json` told macOS to render it as a pure-alpha silhouette, which collapsed the entire icon (including the dark background filling the rounded square) into a solid white block in the menu bar. Replaced with a transparent-background 88×88 PNG showing just the teal house outline + neural-network nodes from the app icon's foreground artwork, and switched `iconAsTemplate` to `false` so the teal renders as actual color rather than getting flattened to a silhouette. Reads cleanly at menu-bar size (44×44 effective) in both light and dark menu bars, and is immediately recognizable as the same icon you see in the dock."}]}}, {"version": "0.2.34", "date": "2026-05-22", "sections": {"Added": [{"title": "Choose what an auto-launch looks like.", "detail": "A radio pair appears underneath the *Launch at login* toggle (from v0.2.33), visible only when that toggle is on: - **Minimize to tray** (default) — window stays hidden, only the tray icon appears. The classic background-daemon UX most users want from a chat app pinned to boot. - **Show the chat window** — window comes up immediately, just like a manual double-click would. Useful if you want KinAI front-and-center the moment you sign in. Mechanism: the LaunchAgent / Run entry passes `--autostart` in argv. On startup we check both that flag AND `cfg.startup.autostart_minimized` — only the intersection (OS auto-launched AND user opted into minimized) keeps the window hidden. Manual launches always show the window regardless, because they don't carry the `--autostart` flag."}]}}, {"version": "0.2.33", "date": "2026-05-22", "sections": {"Added": [{"title": "Launch KinAI at login.", "detail": "New toggle in *Settings → You*. When on, KinAI starts every time you sign in to this computer. Works on both macOS (writes a per-user LaunchAgent plist to `~/Library/LaunchAgents/` — no admin password required) and Windows (writes a value under `HKCU\\Software\\Microsoft\\Windows\\ CurrentVersion\\Run`). The toggle is per-machine: enabling it on your laptop doesn't affect your desktop or your kid's MacBook. Toggle state always reflects the OS ground truth (we re-read the LaunchAgent / registry on every flip rather than trusting a cached value), so what you see in Settings is always what will actually happen at boot."}]}}, {"version": "0.2.32", "date": "2026-05-21", "sections": {"Added": [{"title": "KinAI now remembers facts about you across every conversation, every device, every session.", "detail": "The previous behaviour was \"each chat starts fresh\" — if you told it you live in Berlin on Monday, a new chat on Tuesday had to be told again. That ended. Three cooperating systems handle this: - **The `remember` tool.** A new tool the model calls whenever you state a stable fact about yourself (\"I live in Berlin\", \"my wife is named Anna\", \"I'm vegetarian\", \"I prefer metric units\"). The fact gets written to a new `user_facts` table keyed by (peer_id, key) — calling remember twice with the same key overwrites, which is how you update a fact when your life changes (\"I moved to Munich\"). The model acknowledges what it stored in plain prose so you always know what it picked up. Mirror tool `forget(key)` deletes a fact when you ask it to. - **A passive background extractor.** After every reply, a tiny side LLM call scans the user message (\"Does this contain a persistent fact?\") and stores anything new it finds. Runs only on messages that look fact-shaped (first-person pronoun, length above a small threshold), so \"thanks\" and \"?\" don't burn a round-trip. Conservative: only ADDS facts whose key doesn't already exist, never overwrites what you stated explicitly via the tool. Marks facts with `source = \"extractor\"` so the UI distinguishes inferred from stated. - **Cross-thread memory notes.** The existing thread summarization (auto-folds the oldest messages of long chats into searchable summaries) used to only surface notes within the thread that produced them. Now scoped to peer instead, so a summary from last Tuesday's chat can answer \"what was that project deadline we discussed\" today."}, {"title": "Settings → Memory", "detail": "is a new page that lists every stored fact with chips marking the source (\"you typed\" / \"said in chat\" / \"inferred\"), inline edit, single-fact delete, and a \"Forget everything\" button. You always have full control — nothing is hidden, nothing is locked. The model reads from this same store on every turn, so an edit takes effect immediately on the next message."}, {"title": "Privacy boundary preserved.", "detail": "All three paths scope by `peer_id`, so one family member's memory never bleeds into another's prompt. Same invariant the rest of the DB layer follows; FTS5 BM25 queries on `memory_notes` and direct lookups on `user_facts` both filter on it."}, {"title": "Conversations now name themselves.", "detail": "The first user message you send in a thread becomes the thread title automatically, replacing the generic \"New conversation\" / \"Welcome\" / \"Quick chat\" placeholder. So a chat that starts with \"What is going on in the world today?\" lands in the sidebar as \"What is going on in the world today\" instead of yet another \"New conversation\" row. Title-derivation rules: collapse whitespace, prefer a clean break at the first sentence-ending punctuation between 10–60 chars in, otherwise cap at 50 chars with an ellipsis, strip trailing punctuation. Telegram-paired threads stay labeled \"Telegram\" (they're meant to be visually distinct), and any title you've already customised is left alone."}, {"title": "Rename any conversation in place.", "detail": "A small pencil icon appears next to the trash icon on hover in the sidebar. Click it to inline-edit the title — Enter saves, Escape cancels, clicking elsewhere also saves. Useful for tidying up auto-generated titles, grouping related chats with shared prefixes (\"Code · …\", \"Recipes · …\"), or fixing a title after the conversation drifted to a different topic."}, {"title": "Copy buttons on every message — both your prompts and the assistant's replies.", "detail": "A small \"copy\" affordance appears below each bubble (right side of your own messages, in the metrics row of replies). Tap it once and the message lands on your clipboard in TWO formats simultaneously: rich HTML (headings, code blocks, lists, bold and italic survive paste into Notes, Pages, Word, Slack, Notion) AND plain markdown (terminals, code editors, anywhere HTML would render as tag garbage). The paste target picks whichever it understands — no need to think about it. Confirmation flips the icon to a checkmark for 1.5 seconds, then resets. Works for both your questions (so you can re-grab a prompt you typed and reuse it elsewhere) and the model's answers (so a useful reply is one click away from the document you actually need it in)."}], "Fixed": [{"title": "The Stop button actually stops now.", "detail": "The little square that appeared during a turn was a placeholder — clicking it called `app.send('')` (i.e. tried to send an empty message), which the send-guard immediately rejected, so the button did nothing. The matching backend command (`stop_generation`) was a stub that returned Ok with a `// MVP: simplified` comment. End result: when KinAI hung mid-turn — three dots pulsing, no answer, no tokens ever — the only recovery was Force Quit. This release wires the whole path end-to-end: - Every send_message registers its `CancellationToken` in a per-app `pending_turns` map keyed by the client-supplied message id. A Drop-guard removes the entry on completion (or panic, so a crashed turn can't leak a stale entry). - The Stop button calls a new `stopGeneration(client_msg_id)` IPC which looks up the token and fires `.cancel()`. The cancellation propagates through `loop_pipeline` (which checks `cancel.is_cancelled()` between each delta and between tool rounds) and through `stream::pump` (which selects between `cancel.cancelled()` and the SSE stream). - The really subtle bit: the HTTP `request.send().await` that OPENS the LLM stream wasn't itself selectable on the cancel token. So when the model was hung BEFORE producing any bytes (TCP connected, headers never arrive — common with overloaded Ollama / vLLM servers), the entire stack was blocked on a single uncancellable await and no amount of token-firing helped. Wrapped that await in a `tokio::select!` against the cancel token, which is the actual mechanical fix for the hung-turn case the user hit. - The frontend also clears its local placeholders + `busy` flag immediately on click, with a 2s ceiling on waiting for the IPC. If the host is so wedged that even the cancel IPC hangs, the UI still becomes responsive — you can send the next message instead of restarting KinAI."}, {"title": "The prompt context-builder was loading the OLDEST 50 messages of each thread, not the most recent 50.", "detail": "This is the root cause of every \"model lost the context\" complaint — both in the KinAI desktop app (the \"What's going on in the world? / continue → random joke\" story) AND on Telegram (\"loses context after one question, also not after ten\"). The SQL query in `db::messages::load` ordered by `created_at ASC LIMIT 50`, which for a thread with 200+ turns silently returned messages 1–50 — meaning the LLM saw your very first conversations from weeks ago, never the turn that just finished. \"Continue\" then continued whatever pattern matched the last ancient message in the window (often a joke from early testing, hence the bizarre joke-after- news behavior). Changed to `ORDER BY created_at DESC LIMIT 50` with a Rust `reverse()` so chronological order is preserved in the prompt. Effect: every multi-turn chat (desktop + Telegram + overlay) now actually has continuity, regardless of how long the thread is. No data migration needed — your messages were always in the DB, the bug was just which slice we asked for."}, {"title": "Context-window autofill now works for llama.cpp servers.", "detail": "Previously, picking a model on a llama.cpp backend silently left `Context Window` at the 8192 default — the detector only checked `/v1/models` for a `max_model_len` field, which llama.cpp doesn't expose (it only returns `id`, `object`, `created`, `owned_by` there). The actual runtime context size lives in `/props.default_generation_settings.n_ctx` (the value passed via the server's `-c` flag on startup), so the detector now hits `/props` first for `provider = \"llamacpp\"` and falls back to `/v1/models` only if that doesn't work. Effect: a 35B Qwen3 deep model launched with `-c 32768` now shows 32768 instead of the misleading 8192, so the prompt builder uses the full window and stops truncating multi-turn history for no reason. Existing setups need to re-click \"Refresh models\" (or re-pick the model) in Settings → LLM to trigger autofill against the new code; or just type 32768 (or whatever your server is serving) into the field manually."}]}}, {"version": "0.2.31", "date": "2026-05-21", "sections": {"Fixed": [{"title": "Telegram \"typing…\" no longer lingers after fast-model replies arrive.", "detail": "v0.2.30's keep-alive task fired `sendChatAction(typing)` immediately at the start of every turn. For sub-2-second fast-model responses, the HTTP call could reach Telegram AFTER our `sendMessage`, which the server interprets as \"bot started typing again\" and leaves the indicator hanging for ~5 seconds even though the reply already arrived. The keep-alive now waits 1.5 seconds before the first fire — fast turns skip the indicator entirely (no race possible), slow turns get it as before. The 1.5s threshold also doubles as a UX signal: showing \"typing…\" for a sub-second reply was busywork; the user perceived the reply as instant either way."}]}}, {"version": "0.2.30", "date": "2026-05-21", "sections": {"Fixed": [{"title": "Telegram now routes `/fast` and `/deep` properly.", "detail": "The Telegram router was the one chat path that never wired up `route_for`, so users typing `/fast` or `/deep` in Telegram got the routing prefix shoved into the LLM prompt verbatim (and the slot never actually switched — the cached fast client was used either way). The router now uses the same slash resolver as the in-app paths: prefix is stripped, routed to the right slot, persisted as the thread's sticky choice. Telegram and KinAI share that state, so `/deep` in Telegram switches deep mode in KinAI's UI of the same thread too."}, {"title": "Bare `/fast` or `/deep` (no body) confirms the switch.", "detail": "Previously these went to the LLM, which hallucinated a reply about \"deep mode\" being a thing. Now they short- circuit before the model: persist the slot choice, send a short confirmation message back to Telegram (\"🧠 Switched to **deep** model (`<model-name>`). Follow-ups go here until you type `/fast` to switch back.\") — no LLM call, no token spend, no hallucinated semantics."}, {"title": "Telegram \"typing…\" indicator stays on for the whole turn.", "detail": "It used to drop after ~5s because `sendChatAction(typing)` is single-shot. Now a keep-alive task re-fires it every 4s until the LLM completes, so the phone user sees a continuous \"KinAI is typing…\" while the deep model thinks for 30+ seconds instead of staring at a frozen screen."}, {"title": "Telegram-originated assistant messages show the full metrics row in KinAI's UI.", "detail": "Previously they rendered with just `KinAI · 06:40 AM` because the router persisted the message without `metrics` and didn't emit a `kinai://prompt-debug` event. Now they carry the same ttft / tps / tokens / model-badge metadata as in-app turns, plus the 🔍 prompt button (so the user can finally inspect exactly what the model saw on a Telegram turn — which is the diagnostic surface needed to debug the context-loss case in this release)."}, {"title": "Per-slot context window honoured in Telegram.", "detail": "The Telegram path was hard-coded to `cfg.llm.context_window` (the fast slot's value). `/deep` turns now use the deep slot's window + max_tokens, so a 128k-context deep model isn't artificially trimmed to the fast model's smaller window."}], "Added": [{"title": "`/fast` and `/deep` in Telegram's slash-command menu.", "detail": "The bot's `setMyCommands` registration now includes both, so phone users see them in the keyboard hint when they type `/`."}, {"title": "Diagnostic logging for Telegram context builds.", "detail": "Each turn logs the routed slot, the model id, the number of recent messages pulled into the prompt, and the new message's character count. Surface: `tracing::info!` so it shows up in `~/Library/Logs/KinAI/` (or stderr when run from a terminal). Use this to pin down context-loss reports — if `ctx_messages` is low, the issue is in storage / thread routing; if it's high but the model still seems blind, it's an LLM-quality issue."}]}}, {"version": "0.2.29", "date": "2026-05-21", "sections": {"Added": [{"title": "Invite the family → Expires NEVER option.", "detail": "The invite- generation form now has an *Expires* dropdown with `7 days`, `30 days`, `90 days`, `1 year`, and `Never`. Picking *Never* encodes a ~100-year TTL on the JWT (kept under any practical upper bound) and the invite list renders these rows as \"Never expires\" instead of a date. Existing time-bounded invites still expire as before; the option is just additive. You can always revoke a never-expiring invite from the same page."}], "Changed": [{"title": "Repo description / README pitch corrected.", "detail": "Previous copy implied \"one Mac runs the LLM\" — that's wrong. KinAI hosts on a Mac, but the actual LLM can live anywhere on your LAN: Ollama on a Linux box, vLLM on a workstation, LM Studio on Windows, llama.cpp on a Mac mini, an Olares — the host just bridges to whatever OpenAI-compatible endpoint you point at. README intro + Cargo.toml description + repo description all rewritten to reflect the bridge model accurately, and now explicitly note that phones / tablets reach KinAI through the family's Telegram bot (no native iOS / Android app yet)."}]}}, {"version": "0.2.28", "date": "2026-05-21", "sections": {"Changed": [{"title": "`/fast` and `/deep` are now sticky per thread.", "detail": "Previously the slash prefix only routed a single turn — the next plain message snapped back to the global default (fast), which felt surprising. Now typing `/deep <prompt>` switches the active slot for the current thread, and subsequent plain-text messages keep going to deep until you type `/fast` to switch back. The per-message model badge from v0.2.27 (⚡ / 🧠 next to the metrics) shows which slot answered each turn, so you always see the current state. The slot choice is persisted on the thread row, so it survives KinAI restarts."}]}}, {"version": "0.2.27", "date": "2026-05-20", "sections": {"Added": [{"title": "Per-reply model badge.", "detail": "Each assistant message's metrics row now ends with the model that produced it, abbreviated to fit: e.g. `· ⚡ gpt-oss-20b` for the fast slot, `· 🧠 qwen2.5:72b` for the deep slot, or just the model name when only one slot is configured. The full model id is in the hover tooltip. The badge is hidden for slash-command turns (no LLM involved). Same rendering on macOS and Windows — it's in the shared Svelte `MessageBubble` component, and the model name flows through the per-turn metrics that both chat paths (host's `commands::send_message` and client peers' WS `run_chat_turn`) already populate, so the badge shows up regardless of which device sent the message."}]}}, {"version": "0.2.26", "date": "2026-05-20", "sections": {"Changed": [{"title": "Change-backend screen now configures both LLM slots in one step.", "detail": "When you open *Change backend* (host owner only), the configure step now shows two model cards side-by-side: the existing **Fast model** plus the new **Deep model (optional)**. Each card has the same fields (provider, base URL, model, context window, test connection) plus its own Active / Paused toggle. The detected-backend list at the top has explicit **Fast** and **Deep** assign buttons per backend, so a single discovered server can be assigned to either slot — or to both for testing."}, {"title": "No more auto-rescan when entering the screen.", "detail": "Backend discovery (Localhost + Network scan) now runs only on explicit user action — the *Localhost* or *Network* buttons. The screen used to auto-rescan whenever the cache was older than 1 hour, which fired on most visits and felt noisy. Cached results stay visible across visits; you can refresh on demand. The one exception is a fresh KinAI install with no scan history yet — that still runs one initial scan so the new-user flow isn't an empty list."}]}}, {"version": "0.2.25", "date": "2026-05-19", "sections": {"Added": [{"title": "Two-model chat: `Fast model` + optional `Deep model`.", "detail": "KinAI's Settings now exposes a second LLM slot — a typically larger, slower model — alongside the existing one. Two new slash commands route a turn to a specific slot: - `/fast <prompt>` → the existing default model - `/deep <prompt>` → the new secondary model Both slashes appear in the autocomplete only when BOTH slots are active (configured + not paused) — a single-model setup hides them so the menu stays uncluttered. The routing token is stripped before the LLM sees the prompt; the original message text (including the `/fast` or `/deep`) is preserved in chat history. Falls back gracefully: if only `deep` is configured, plain messages route there; if only `fast` is configured, behaviour is identical to v0.2.24 and earlier."}, {"title": "Pause toggle per model.", "detail": "Each slot has an Active / Paused switch in Settings. A paused slot is excluded from slash autocomplete AND skipped during default routing — useful for temporarily disabling one without losing its configuration."}]}}, {"version": "0.2.24", "date": "2026-05-19", "sections": {"Fixed": [{"title": "🎤 Microphone now actually works", "detail": "(the v0.2.x mic regression that survived v0.2.19, .21, .22, and .23). Users granted KinAI **both** *Microphone* AND *Speech Recognition* in System Settings and still saw \"Speech recognition is blocked\" because KinAI's signed binary had NO hardened-runtime entitlements at all. macOS's hardened runtime gates every privileged capability — the `NSMicrophoneUsageDescription` in Info.plist makes the OS *prompt* for permission, but the OS won't *grant* the underlying syscall unless the binary also carries the matching `com.apple.security.device.audio-input` entitlement. The Privacy toggle becomes a no-op against an unentitled binary. Compare with the Claude desktop app on the same machine: ``` Claude: com.apple.security.device.audio-input = true ✓ KinAI: <no entitlements> ✗ ``` Added `entitlements.plist` with `audio-input`, `camera` (for future vision-via-webcam), and `allow-jit` (WKWebView JS), and updated `scripts/deploy.sh` to pass `--entitlements` to `codesign`. Verified post-build via `codesign -d --entitlements -` that the bits are present, and webkitSpeechRecognition.start() actually succeeds now."}]}}, {"version": "0.2.23", "date": "2026-05-19", "sections": {"Fixed": [{"title": "shellOpen actually works now (Privacy buttons + every other external link).", "detail": "v0.2.22 added `plugins.shell.open` as a regex string to whitelist macOS Privacy-pane URLs, but I missed that Tauri 2's shell plugin wraps the regex with `^…$` anchors, and my pattern had no trailing match for \"rest of the URL\". So `^^(https?://|x-apple.systempreferences:|ms-settings:)$` required URLs to END right after the scheme — meaning EVERY URL was silently rejected, including http(s) ones used by the X handle / GitHub / website links in Settings. Appended `.+` to the regex so it matches `<scheme>` followed by the rest of the URL. Tested by clicking the buttons in v0.2.23 → System Settings actually opens to the right Privacy pane now."}]}}, {"version": "0.2.22", "date": "2026-05-19", "sections": {"Fixed": [{"title": "Mic-error Privacy-pane buttons now actually open System Settings.", "detail": "v0.2.21 added two helpful \"Open Mic settings\" / \"Open Speech Recognition settings\" deep-links next to the permission-blocked error, but clicking either was a no-op — Tauri 2's shell plugin scope rejects any URL whose scheme isn't in the `plugins.shell.open` regex, and we only had the default (http/https). The custom `x-apple.systempreferences:` scheme was silently denied. Extended the scope regex to whitelist macOS's Privacy-pane deep-link scheme (and `ms-settings:` for the eventual Windows equivalent), so both buttons now jump straight to the right pane. The error handler also surfaces a fallback message with manual instructions if the shell open ever fails for any other reason."}]}}, {"version": "0.2.21", "date": "2026-05-19", "sections": {"Fixed": [{"title": "Overlay slash commands (`/help`, `/pic`, `/picHQ`) now actually render their reply.", "detail": "The Spotlight-style overlay showed an empty result area for any non-streaming reply: the overlay's `onAssistantDone` listener only flipped `busy` off and never read `message.content`, so slash-command outputs (which the host sends in one shot, without streaming tokens) ended up invisible. Streaming LLM replies worked because they fed `streamingContent` via `onToken`. Now `onAssistantDone` backfills `streamingContent` from `message.content` when it's empty, so both streaming and non-streaming paths render in the overlay."}, {"title": "Mic error UX now explains the macOS two-permission model.", "detail": "Users granted KinAI Microphone access in System Settings and still saw \"Speech recognition is blocked\" — because macOS requires a **second** permission, *Speech Recognition*, in a separate Privacy pane. The Web Speech API can't tell them apart (both return `not-allowed`), so the v0.2.19 error message only mentioned Microphone, leaving users stuck. Now the error explicitly says both are required, includes a \"quit and relaunch\" hint (WebKit caches the denied state for the lifetime of the process), and exposes **two** deep-link buttons: *Open Mic settings* and *Open Speech Recognition settings*. Both link to the right Privacy panes in System Settings on macOS 13+. Windows / Linux hide the buttons since there's no equivalent URL."}]}}, {"version": "0.2.20", "date": "2026-05-19", "sections": {"Fixed": [{"title": "Windows in-app auto-update is now actually wired up.", "detail": "All the host-side plumbing has been in place since v0.2.0 — the `/v1/update/manifest` endpoint serves a per-platform Tauri updater manifest, `scripts/deploy.sh::stage_windows_update` pulls the latest Windows updater bundle from the `test-windows.yml` workflow's artifact, and the client's updater plugin polls the host on every reconnect. But the workflow's `actions/upload-artifact@v4` step was only uploading 2 of the 6 produced files (`.msi` and `.exe` — silently dropping the four `.msi.zip` / `.nsis.zip` / `.sig` patterns that the multi-line glob couldn't match). The host's stage step saw no updater bundle, the manifest never advertised `windows-x86_64`, and Windows clients sat on whatever version they installed manually with no in-app update prompt. Fixed by replacing the fragile multi-line glob with a single `bundle/**` capture that catches every file under the tauri-bundler output directory (~7 files including all the auto-update sidecars). Windows clients on v0.2.7+ should now receive an in-app update banner on every release the same way macOS clients do."}]}}, {"version": "0.2.19", "date": "2026-05-19", "sections": {"Added": [{"title": "Project website surfaced everywhere.", "detail": "Added [kin-ai.replit.app](https://kin-ai.replit.app) as the GitHub repo homepage, the `homepage` field in `Cargo.toml`, a *Website* button on the About page, and a third link in the Settings footer next to *Follow on X* and *GitHub*. Every install now has a one-click path to the public site."}], "Changed": [{"title": "Friendlier mic-button errors.", "detail": "Pressing the overlay's mic button without microphone permission used to surface a raw `Speech recognition error: not-allowed` string that lingered in the UI. The message is now human-readable (\"Microphone access is blocked. Open System Settings → Privacy & Security → Microphone and turn KinAI on.\"), shows a **Fix** button that deep-links to macOS's Privacy → Microphone pane, and auto-dismisses after 8 seconds. A small ✕ dismisses it manually too. Same treatment for `audio-capture` (no mic detected) and `network` (offline) errors."}]}}, {"version": "0.2.18", "date": "2026-05-19", "sections": {"Fixed": [{"title": "Quick-chat overlay hotkey no longer drags the main KinAI window forward.", "detail": "Pressing the global hotkey (default `CmdOrCtrl+Space`) was popping the small \"Ask KinAI…\" overlay AND pulling the full app window into view at the same time. The cause was a cross-platform side effect of `set_focus()` on the overlay: on macOS focusing any KinAI window activates the app, which brings every visible KinAI window to the foreground; Windows does the equivalent. The toggle now hides the main window first so the only KinAI surface left visible is the Spotlight-style input. Bring the main window back via tray → *Open KinAI* (or by relaunching from the Dock / Start menu)."}]}}, {"version": "0.2.17", "date": "2026-05-19", "sections": {"Changed": [{"title": "KinAI→Telegram echo: combine Q&A into one bot message with a blockquote question.", "detail": "v0.2.16 sent the user's question and the assistant's reply as two separate bot messages, which made the question look like the bot was talking to itself (Telegram bots can't impersonate the human, so both ended up styled as bot messages). The two posts now collapse into a single bot message where the question is rendered inside a Telegram `<blockquote>` (HTML parse_mode — gives it the indented left-bar look Telegram users recognise from forwards / reply previews) and the assistant reply flows below it in plain text. /pic photo replies use the same combined format as a caption."}, {"title": "\"Typing…\" indicator while the LLM thinks.", "detail": "Before kicking off the LLM turn, the bot fires a one-shot `sendChatAction(typing)` so the phone user sees \"Bot is typing…\" in the Telegram chat while the response is being generated. Best-effort, ~5s default on Telegram's side."}]}}, {"version": "0.2.16", "date": "2026-05-19", "sections": {"Fixed": [{"title": "User questions typed in KinAI weren't mirroring to Telegram.", "detail": "v0.2.13's bidirectional sync only echoed assistant replies — when the user typed a question from KinAI's UI on a Telegram thread, the answer arrived on Telegram but the question itself didn't, leaving the phone chat with replies that had no visible prompt. KinAI now also pushes the user's question to Telegram (prefixed `💬 You:` since Telegram bots can't impersonate the human user). Same gating: only fires on Telegram threads for a paired peer, and skips messages that originated on Telegram in the first place (to avoid bouncing them back)."}]}}, {"version": "0.2.15", "date": "2026-05-19", "sections": {"Fixed": [{"title": "Client peers couldn't see Telegram threads in their KinAI sidebar.", "detail": "The `list_threads` and `load_thread` Tauri commands read only the client's *local* DB (filtered by `HOST_PEER`), but Telegram-originated threads live in the *host's* DB tagged with the client's invite_id and never made it to the client's local DB. Result: even though the host correctly fanned out `Envelope::Message` over the WebSocket and the client received it, the sidebar refresh couldn't find the matching thread row and the Telegram conversation stayed invisible. Both commands are now mode-aware — in Client mode they send `Envelope::ListThreads` / `LoadThread` to the host and await the response (10s timeout, falls back to local DB on failure). The host returns the threads + messages filtered by the client's invite identity, so Telegram conversations now show up in client sidebars and load fully on click."}]}}, {"version": "0.2.14", "date": "2026-05-19", "sections": {"Fixed": [{"title": "Telegram → KinAI fan-out.", "detail": "Messages sent from a paired Telegram chat were persisted on the host but never surfaced to the KinAI UI in real time — the chat only appeared after the user manually reloaded their thread list. The router now emits `kinai://message` for the host's own Telegram thread and pushes `Envelope::Message` over the WebSocket for paired client peers, matching the in-app chat fan-out. The sidebar also auto-refreshes its thread list when it sees a message for an unknown thread, so a fresh Telegram conversation appears in the sidebar without a reload."}]}}, {"version": "0.2.13", "date": "2026-05-19", "sections": {"Added": [{"title": "Telegram is now a first-class family chat surface.", "detail": "Every family member can chat with KinAI from their phone over Telegram — same model, same memory, same threads. The host owner sets up **one shared bot via @BotFather** (once), and each member pairs their own Telegram from *Settings → Telegram* via QR code. Each user has their own private 1:1 chat with the bot; other family members never see your messages."}, {"title": "Bidirectional sync.", "detail": "Messages sent from Telegram show up in the matching KinAI thread instantly. Assistant replies generated inside KinAI on that thread are also mirrored back to your Telegram chat, so the conversation stays in step on the phone."}, {"title": "Slash commands work in Telegram.", "detail": "`/help`, `/pic`, `/picHQ` behave identically to in-app — and `/pic`-generated images are uploaded as actual Telegram photos (not just links)."}, {"title": "Client-mode pairing via WebSocket.", "detail": "The Connect-Telegram QR flow works for the host AND for every connected client peer. Behind the scenes, the client's Tauri command sends a `RequestTelegramPair` envelope to the host, which mints a token bound to that client's invite identity and replies with the scannable URL. No bot tokens ever leave the host machine."}, {"title": "Changelog window.", "detail": "Pops up once after each update so you can see what's new. Built from this `CHANGELOG.md` embedded in the binary; \"Got it\" stamps the seen version into your local config."}], "Fixed": [{"title": "Bot-username advertised over Welcome.", "detail": "The host's `Welcome` envelope now carries `host_telegram_bot` so client peers can show *\"Family bot: @your_family_bot\"* and enable their pair button without a separate round-trip."}]}}, {"version": "0.2.11", "date": "2026-05-19", "sections": {"Added": [{"title": "Telegram foundation (host-only).", "detail": "First slice of the Telegram integration: bot token Setting, long-poll loop against the Telegram Bot API, router that handles `/start` pairing, inbound messages → KinAI LLM → reply back, slash commands, `/pic` outbound as actual photos. Pairing UI initially gated to the host peer; client-mode pairing followed in v0.2.13."}]}}, {"version": "0.2.10", "date": "2026-05-18", "sections": {"Fixed": [{"title": "Window close button", "detail": "now hides the main window on macOS instead of destroying it, matching the Windows behavior added in 0.2.9 — relaunching KinAI from the Dock now brings the window back instead of silently no-op'ing."}, {"title": "Overlay transparency on macOS", "detail": "also bumped to 90% (was Windows-only in 0.2.9). Improves readability over light desktop backgrounds."}, {"title": "Settings save feedback", "detail": "flashes a green ✓ for 2.5s next to the Save button after every successful settings change."}, {"title": "macOS image download", "detail": "routed through a Rust IPC command so WKWebView's App Transport Security doesn't block plain-HTTP attachment downloads from the host."}, {"title": "Prompt debug panel", "detail": "(\"🔍 prompt\" toggle under each assistant message) strips inline image data URLs before serializing — a single attached PNG used to bloat the JSON to 7-8 MB and lock the WebView when the user clicked the button."}]}}, {"version": "0.2.9", "date": "2026-05-18", "sections": {"Added": [{"title": "Windows client.", "detail": "Windows 10/11 (x86_64) is now a first-class client platform. Pair to a Mac host via 6-character invite code or full `kinai://join?…` link, send messages, get streamed replies back from the Mac mini's local LLM. The installer is an MSI (or NSIS-style `.exe`) under *Releases → Assets*. Windows code-signing isn't in this release yet, so SmartScreen will warn the first time — click *More info → Run anyway* (one-time). The full source is public, so the binary is auditable end-to-end. **Windows is client-only for now** — hosting still requires macOS."}, {"title": "`/pic` and `/picHQ` slash commands.", "detail": "Optional. When the host owner points KinAI's Settings → Image generation at a ComfyUI server (e.g. an Olares One on the LAN), every paired family device gets two new chat commands: `/pic <prompt>` (Z-Image Turbo, ~5s, 1280×720) and `/picHQ <prompt>` (Z-Image Base, ~30s, 1024×1024). Optional `WxH` prefix overrides the size (`/pic 1024x1024 a sunset over Miami`). Empty `base_url` = feature disabled, no flags visible."}, {"title": "`/help` and `?`.", "detail": "Lists available slash commands in chat. Adapts based on whether image-gen is configured."}, {"title": "Slash-command autocomplete popup", "detail": "in the chat input — type `/`, get a menu, ↑↓ to navigate, Tab to accept, Esc to dismiss. Resolution hint surfaces under the highlighted command."}, {"title": "`↗ Open` + `↓ Download` buttons", "detail": "under every chat image. Tauri's WebView blocks the browser-native right-click options (Open in New Window, Save Image As…) on both platforms, so the buttons route through the shell + fs plugins explicitly. Click the image itself = Open. Download pops a Save dialog."}, {"title": "Host auto-pulls new GitHub releases hourly", "detail": "and stages them for connected family clients. No more manual deploy steps — publish a release on GitHub, every family Mac auto-updates from the host within hours. (Windows in-app auto-update is still manual until we ship the `.nsis.zip` updater bundle alongside.)"}], "Fixed": [{"title": "Cross-machine URL-paste pairing.", "detail": "Pasting a `kinai://join?…` invite link on any device that wasn't the one that minted it used to fail with *\"Invalid signature\"* — `peek_token` was validating the JWT against the LOCAL public key, but the host signed with a DIFFERENT keypair. Signature is now only verified on the WebSocket handshake (where the host actually has the matching key). Unblocked Windows pairing entirely."}, {"title": "Sidebar showed the invite label as the host name", "detail": "(\"WindowsPC\" instead of \"Our Family\"). Now uses `hostInfo.family_name` from the Welcome envelope, with the invite label as a small subtitle *\"joined as WindowsPC\"*."}, {"title": "Window can't reopen after close.", "detail": "On Windows, closing the X destroyed the main window; relaunching the .exe trickled into the single-instance handler which called `show()` on a destroyed window — silent no-op. Now the X hides the window; show() brings it back."}, {"title": "Overlay too transparent on Windows.", "detail": "WebView2 doesn't render backdrop-blur as effectively as macOS NSVisualEffectView. Bumped the glass-card opacity from 70% → 90%."}, {"title": "Visible feedback when saving Settings", "detail": "— green ✓ pill next to the Save button for 2.5s after success, red inline error on failure."}, {"title": "macOS image download \"TypeError: Load failed\".", "detail": "WKWebView's App Transport Security blocked JS `fetch()` against the host's plain-HTTP `/v1/pic/...` URL (even though `<img src>` loaded the same URL fine via a different code path). Download now goes through a Rust IPC command using `reqwest`, which has no ATS restriction."}, {"title": "Auto-updater on macOS", "detail": "stopped producing the signed `.app.tar.gz` updater bundle because the deploy script's internal tar invocation included AppleDouble metadata files (`._KinAI.app`) that Rust's `tar` crate then tried to write alongside the real `.app` directory and crashed with *\"failed to unpack\"*. Added `COPYFILE_DISABLE=1` to the tar step."}], "Known": [{"title": "macOS only for hosting. Windows + Linux host support is a later roadmap item.", "detail": ""}, {"title": "Windows auto-update inside the app is not wired up yet.", "detail": "Tauri's `--bundles updater` flag isn't producing the `.nsis.zip` / `.msi.zip` auto-update bundles we'd need to push updates to Windows clients silently. Until that's resolved, Windows users re-download the `.msi` from GitHub Releases when notified of a new version. macOS clients auto-update through the host on every release."}, {"title": "SmartScreen warning on first install of the Windows MSI.", "detail": "Cleared by a one-time *More info → Run anyway*. Goes away once we buy a Windows code-signing certificate ($200–500/yr)."}]}}, {"version": "0.2.6", "date": "2026-05-16", "sections": {"Added": [{"title": "Signed + notarized macOS builds.", "detail": "KinAI is now signed with Apple's Developer ID Application certificate and notarized through Apple's notary service via `notarytool` + an App Store Connect API key. End users no longer see *\"KinAI can't be opened because Apple cannot check it for malicious software\"* on first launch — just the standard *\"KinAI was downloaded from the internet — open?\"* prompt that any signed third-party app gets. `spctl --assess` now reports `source=Notarized Developer ID`."}, {"title": "`scripts/deploy.sh` sources `~/.kinai/keys/apple.env` for local signing credentials; CI consumes the same credentials vi", "detail": ""}], "Fixed": [{"title": "Signing the .app failed on developer Macs with iCloud Drive enabled", "detail": "(\"resource fork, Finder information, or similar detritus not allowed\"). macOS's `bird` daemon re-attaches `com.apple.FinderInfo` + `com.apple.fileprovider.fpfs#P` xattrs to any new bundle under `~/Documents` faster than the build can strip them, and `codesign --force` refuses to sign a bundle with those present. Workaround in `scripts/deploy.sh`: tauri-bundler now produces an UNSIGNED `.app`, which we copy to `/tmp/kinai-sign/` (bird ignores `/tmp`), then xattr-strip + codesign + notarytool + staple there, then copy the signed/stapled bundle back into the project tree for DMG packaging and updater tarballing."}]}}, {"version": "0.2.5", "date": "2026-05-16", "sections": {"Added": [{"title": "Settings → Follow on X · @gogo6969 + GitHub", "detail": "links under the version line, so every install has a reachable maintainer channel without us shipping telemetry or phone-home."}, {"title": "Auto-recheck for updates on every successful (re)connect", "detail": "— when the client's WebSocket handshake completes, the updater polls the host's manifest within 1 second. Result: a host bump propagates to clients within a few seconds of their next reconnect, instead of waiting up to the 4 h periodic interval."}, {"title": "Project pitch reframed across `README.md`, `Cargo.toml`, and `tauri.conf.json`: **KinAI is the family-sharing layer for", "detail": ""}], "Fixed": [{"title": "Manage Family showed the same device twice", "detail": "during reconnects — the server now evicts any prior peer entry with the same invite (`claims.sub`) before inserting the new one. \"One invite, one live device\" is now enforced, matching the recommended best practice of one invite per device."}, {"title": "Updater silently ignored host LAN manifests", "detail": "because Tauri's default rejects non-HTTPS URLs. Enabled `plugins.updater.dangerousInsecureTransportProtocol: true` so LAN HTTP endpoints are accepted (signature verification still runs)."}]}}, {"version": "0.2.0", "date": "2026-05-15", "sections": {"Added": [{"title": "PDF input", "detail": "— drag, drop, paste, or attach a PDF; the host extracts text server-side via `pdf-extract` and inlines it into the LLM prompt. Works with any chat model."}, {"title": "Image input", "detail": "— same UX as PDFs. Routed to a vision-capable endpoint (see Vision below)."}, {"title": "25 MB per-file cap", "detail": ", enforced on both frontend and backend. #### Vision routing"}, {"title": "Per-turn routing", "detail": "— image-bearing turns automatically route based on whether the active chat model is vision-capable: - **Chat model is vision-capable** (Claude Sonnet/Opus, Gemini Pro/Flash, GPT-4o, llava, qwen-vl, moondream, minicpm-v, pixtral, cogvlm, internvl, phi-3-vision, …) → used directly, no rerouting. - **Otherwise** → routed to the configured Vision endpoint."}, {"title": "One-shot failover", "detail": "— on transient cloud errors (5xx, 429, \"high demand\", RESOURCE_EXHAUSTED, \"overloaded\", timeouts) the request retries against the failover endpoint exactly once."}, {"title": "Three quick-fill presets in Settings + onboarding", "detail": ": Gemini 2.5 Flash, Claude 3.5 Haiku (Anthropic OpenAI-compat alias), Local llava via Ollama. Presets fill `base_url` + `model` only; the user supplies the API key."}, {"title": "OpenAI multipart wire format", "detail": "— same payload shape for every supported provider (Gemini, Anthropic, vLLM, Ollama). One code path covers all."}, {"title": "Test vision", "detail": "button sends a 1×1 PNG with \"what color?\" to verify the endpoint accepts multipart before the first real request. #### Image search"}, {"title": "New built-in `image_search` tool — find pictures on the web from a query.", "detail": ""}, {"title": "DuckDuckGo mode (default)", "detail": "uses Wikimedia Commons under the hood — free, CC-licensed, no API key. Strong coverage for landmarks, history, people, biology."}, {"title": "Exa mode", "detail": "reuses the existing Exa API key. Each result contributes its primary image via `contents.images`."}, {"title": "Model is instructed to call it for \"show me a photo of X\" / \"what does Y look like\" intent. #### Safe inline image rende", "detail": ""}, {"title": "The markdown pipeline now renders `![](url)` as actual `<img>` tags inside chat bubbles — for image-search results, mode", "detail": ""}, {"title": "URL allow-list", "detail": ": `https://`, `http://` (host LAN), `data:image/*;base64,*`. Anything else (`javascript:`, `file:`, …) renders as a visible red \"blocked image\" pseudo-link, never as an executable element."}, {"title": "Lazy-loaded, max-height 320 px, theme-aware border. #### Multi-device infrastructure", "detail": ""}, {"title": "Host-distributed auto-updates", "detail": "— host stages signed `.app.tar.gz` + `.sig` under `~/.kinai/updates/<version>/<target>/` and serves them at three new endpoints: - `GET /v1/update/manifest` → Tauri-format JSON - `GET /v1/update/bundle.tar.gz` → the binary - `GET /v1/update/bundle.tar.gz.sig` → Minisign signature"}, {"title": "Client updater", "detail": "— polls the host first (on launch + every 4 h), falls back to GitHub Releases if the host has been unreachable for >24 h."}, {"title": "In-app update banner", "detail": "with version, source (\"from your host\" / \"from GitHub\"), download progress %, Install & restart, Dismiss."}, {"title": "Signing keypair", "detail": "generated via `pnpm tauri signer generate`; private key kept outside the repo at `~/.kinai/keys/updater.key`, public key baked into every install via `tauri.conf.json`."}, {"title": "Per-peer context isolation", "detail": "— every thread + memory note tagged with the connecting peer's invite short_code. `list_threads`, `load_messages`, `search_memory` all filter by `peer_id`. Family members never see each other's chats, prompts, or summaries."}, {"title": "Auto-reconnect supervisor", "detail": "with exponential backoff (2s → 30s cap) + \"Reconnect now\" button in the sidebar."}, {"title": "6-character invite codes", "detail": "— clients can type a code instead of pasting a full `kinai://join?…` URL. Host's `GET /v1/invite/redeem?code=XXX` resolves it to the JWT."}, {"title": "Live host info on every client", "detail": "— Welcome envelope advertises model, search engine, vision label, host version. Client Settings shows it read-only. #### Onboarding"}, {"title": "New **Vision setup step** in the host wizard between Search engine and Start hosting. Skippable. Three preset shortcuts", "detail": ""}, {"title": "Saved-host fallback", "detail": "on the Client setup page — if mDNS comes up empty, the previously-connected host appears in the list with a \"saved\" badge so a fresh invite code can still be redeemed."}, {"title": "\"Scan again\"", "detail": "button on the Client setup page that re-fires the mDNS query (covers the case where the user just granted Local Network permission)."}, {"title": "\"Forget host\"", "detail": "flow on the Client setup page that disconnects and drops the mode back to Unconfigured."}, {"title": "Back button", "detail": "on the Client setup page so users can leave without having to restart the app. #### Settings & UX polish"}, {"title": "Mode-aware Settings", "detail": "— clients see \"You\" (display name) + read-only \"Host\" info (family, model, search engine, vision, host version) + Overlay & Theme. They don't see Local LLM, Search engine, or Test-tool cards (those belong to the host)."}, {"title": "Live sidebar connection indicator", "detail": "— green/amber/red dot driven by the actual WebSocket state, with the host's last error message surfaced inline."}, {"title": "Thinking-dots placeholder", "detail": "stays visible during the pre-token phase of tool-using turns (reasoning + tool call before any visible token)."}, {"title": "Update banner", "detail": "at the top of the chat when a new version is staged."}], "Changed": [{"title": "JWT audience validation", "detail": "— the host's `stats.host_url` is now derived from the LAN IP (same form `invite::create` uses), not from `bind_addr` which is a listen spec like `0.0.0.0`. Previously every Hello frame was rejected with `InvalidAudience`. *(That's why client pairing wasn't working before this release.)*"}, {"title": "Privacy fix", "detail": "— the chat-turn pipeline used to `broadcast()` user messages and AssistantDone events to *every* connected peer + the host's UI. Now it `tx.send()`s only to the originating peer. Other family members no longer see each other's conversations."}, {"title": "Empty-state copy", "detail": "— \"KinAI remembers what your family says\" was misleading (it implied shared memory). Now reads \"KinAI remembers *your* conversations. Private to you. Other family members can't see your chats.\""}, {"title": "Updater", "detail": "— switched to host-first with GitHub fallback (was GitHub-only). Required enabling `plugins.updater.dangerousInsecureTransportProtocol` so LAN HTTP endpoints are accepted (Tauri's default rejects non-HTTPS)."}, {"title": "`run_chat_turn`", "detail": "now upserts the thread row on first SendMessage from a client (the client's `thread_id` only lives in its local DB until then; without the upsert the FK on `messages` would reject the insert)."}, {"title": "`send_message` command", "detail": "is mode-aware — in Client mode it forwards `Envelope::SendMessage` over the active WebSocket instead of running the LLM pipeline locally."}, {"title": "Reconnect race", "detail": "— `connect_client` aborts any in-flight client task before spawning the replacement, so two parallel WS connections can't fight over `net.client_tx`."}], "Fixed": [{"title": "Client Mac crash on launch (0.1.25)", "detail": "— `tokio::spawn` inside Tauri's synchronous `setup()` callback panicked with \"must be called from within a Tokio runtime\"; reverted to `tauri::async_runtime::spawn`."}, {"title": "Sidebar dot stuck on orange", "detail": "— the `kinai://client-status` event fired before the UI subscribed; status now persists in `RuntimeStats` so `refreshStats()` hydrates the indicator on every load."}, {"title": "Chat ordering bug", "detail": "— in Client mode, assistant replies were stuck as streaming bubbles forever (never moved to `messages[thread_id]`). Result: all user messages clustered at the top, all assistant replies at the bottom. Fixed by handling `Envelope::AssistantDone` correctly."}, {"title": "Discovery events missed", "detail": "— moved the `onDiscovery` listener from `/client/+page.svelte`'s `onMount` to the global store's `startListening` so events fired during app boot aren't lost."}, {"title": "TPS readout nonsense", "detail": "— clamps to 0 when generation phase is under 200 ms or output is empty (was reporting 41 000 tok/s for empty responses)."}, {"title": "Tool loops searching forever", "detail": "— pipeline now caps at 5 tool rounds and forces a final no-tools synthesis turn so the model doesn't get stuck in \"search → search → search\"."}], "Security": [{"title": "The updater plugin's `pubkey` is now committed in `tauri.conf.json`; the matching private key is generated locally at `~", "detail": ""}, {"title": "Three Rust warnings cleaned const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);

$("sub").textContent =
  `v${DATA.version} · ${DATA.repo.commits} commits since ${DATA.repo.first_commit} · ` +
  `${DATA.totals.releases} releases · HEAD ${DATA.repo.head}`;

$("stats").innerHTML = [
  [DATA.totals.rust_lines.toLocaleString(), "Rust lines"],
  [DATA.totals.rust_files, "Rust modules"],
  [DATA.totals.frontend_lines.toLocaleString(), "Frontend lines"],
  [DATA.totals.frontend_files, "Frontend files"],
  [DATA.totals.unit_tests, "Unit tests"],
  [DATA.totals.releases, "Releases"],
].map(([n, l]) => `<div class="stat"><b>${esc(n)}</b><span>${esc(l)}</span></div>`).join("");

// ---- Architecture ----
function renderArch(filter = "") {
  const f = filter.toLowerCase();
  let html = "";
  for (const area of DATA.areas) {
    const files = DATA.rust.filter(x => x.area === area.key &&
      (!f || x.path.toLowerCase().includes(f) || (x.doc || "").toLowerCase().includes(f)));
    if (!files.length) continue;
    files.sort((a, b) => b.lines - a.lines);
    html += `<div class="area"><h3>${esc(area.label)} · ${files.length} files</h3>` +
      files.map(x => `<div class="file"><div class="p">${esc(x.path)}</div>` +
        `<div class="d">${esc(x.doc) || "<span style='opacity:.5'>—</span>"}</div>` +
        `<div class="n">${x.lines} ln${x.tests ? " · " + x.tests + "t" : ""}</div></div>`).join("") +
      `</div>`;
  }
  $("arch").innerHTML = html || `<p class="empty">No modules match.</p>`;
}

// ---- Frontend ----
function renderUi(filter = "") {
  const f = filter.toLowerCase();
  let html = "";
  for (const kind of ["route", "component", "lib"]) {
    const files = DATA.frontend.filter(x => x.kind === kind &&
      (!f || x.path.toLowerCase().includes(f) || (x.doc || "").toLowerCase().includes(f)));
    if (!files.length) continue;
    files.sort((a, b) => b.lines - a.lines);
    html += `<div class="area"><h3>${kind}s · ${files.length}</h3>` +
      files.map(x => `<div class="file"><div class="p">${esc(x.path.replace("frontend/src/", ""))}</div>` +
        `<div class="d">${esc((x.doc || "").slice(0, 190)) || "<span style='opacity:.5'>—</span>"}</div>` +
        `<div class="n">${x.lines} ln</div></div>`).join("") + `</div>`;
  }
  $("ui").innerHTML = html || `<p class="empty">No files match.</p>`;
}

// ---- Surfaces ----
(function () {
  const s = DATA.surfaces;
  const block = (label, items) => !items || !items.length ? "" :
    `<div class="area"><h3>${esc(label)} · ${items.length}</h3><div class="chips">` +
    items.map(i => `<span class="chip">${esc(i)}</span>`).join("") + `</div></div>`;
  $("surf").innerHTML =
    block("Routing slots", s.slots) +
    block("Tools the model can call", s.tools) +
    block("Database tables", s.db_tables) +
    block("Host ↔ client protocol messages", s.protocol_envelope) +
    block("Config sections", s.config_structs) +
    block("Tauri commands (frontend → Rust)", s.tauri_commands);
})();

// ---- History ----
function renderHist(filter = "") {
  const f = filter.toLowerCase();
  const rows = DATA.history.filter(v => {
    if (!f) return true;
    if (v.version.includes(f)) return true;
    return JSON.stringify(v.sections).toLowerCase().includes(f);
  });
  $("hist").innerHTML = rows.map(v => {
    const items = [];
    for (const [sec, list] of Object.entries(v.sections)) {
      for (const it of list) {
        items.push(`<li><span class="tag-sec ${esc(sec)}">${esc(sec)}</span>` +
          `<b>${esc(it.title)}</b> ${esc(it.detail.slice(0, 320))}</li>`);
      }
    }
    const big = items.length > 1;
    return `<div class="rel ${big ? "" : "minor"}">` +
      `<h4>${esc(v.version)} <span class="date">${esc(v.date)}</span></h4>` +
      (items.length ? `<ul>${items.join("")}</ul>` : "") + `</div>`;
  }).join("") || `<p class="empty">No releases match.</p>`;
}

// ---- Tests ----
(function () {
  const unitTotal = DATA.totals.unit_tests;
  const withTests = DATA.rust.filter(x => x.tests > 0).sort((a, b) => b.tests - a.tests);
  let html = `<div class="area"><h3>Integration &amp; live tests · ${DATA.tests.length} files</h3>` +
    DATA.tests.map(t => {
      const ign = t.tests.filter(x => x.ignored).length;
      return `<div class="file"><div class="p">${esc(t.file)}</div>` +
        `<div class="d">${esc((t.doc || "").slice(0, 210))}</div>` +
        `<div class="n">${t.tests.length} test${t.tests.length === 1 ? "" : "s"}` +
        `${ign ? " · " + ign + " live" : ""}</div></div>`;
    }).join("") + `</div>`;
  html += `<div class="area"><h3>Unit tests beside the code · ${unitTotal} total</h3>` +
    withTests.map(x => `<div class="file"><div class="p">${esc(x.path)}</div>` +
      `<div class="d">${esc(x.doc)}</div><div class="n">${x.tests}</div></div>`).join("") + `</div>`;
  $("tests").innerHTML = html;
})();

// ---- Tabs + filters ----
document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b === btn)));
    document.querySelectorAll(".panel").forEach(p => p.hidden = p.id !== "p-" + btn.dataset.p);
  });
});

$("q-ui").addEventListener("input", e => renderUi(e.target.value));
$("q-hist").addEventListener("input", e => renderHist(e.target.value));

renderArch(); renderUi(); renderHist();
